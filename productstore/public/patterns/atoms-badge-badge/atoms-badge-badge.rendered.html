      "patternDesc": "<h2>Overview</h2>\n<p>The <code>&lt;a-badge&gt;</code> component is a flexible vue component designed to overlay a customizable badge on any other component.\nThis component can be used to indicate features such as premium content. It wraps the content in a <code>button</code> or <code>div</code> tag and conditionally converts any nested <code>button</code> or <code>a</code> tags into span elements, depending on whether the badge is considered a <strong>&quot;Grow Premium&quot;</strong> badge or not.</p>\n<ul>\n<li><code>&lt;a-badge&gt;</code> is a wrapper component and works with any component.</li>\n<li>Special behavior ( convert 'button', 'a' to span and 'article' tag to div) is applied when <code>IsGrowPremiumPopup</code> is <code>true</code> to enforce valid HTML semantics.</li>\n</ul>\n<hr>\n<h3>VueJs:</h3>\n<h4>Implementation with props</h4>\n<pre><code>  &lt;a-badge \n      aria-label=&quot;Premium Badge&quot; \n      background-color=&quot;#FFE500&quot; \n      badge-position=&quot;top-right&quot; \n      tailwind-classes=&quot;text-xs font-bold uppercase&quot; \n      text-color=&quot;#000000&quot;\n      title=&quot;PREMIUM&quot; \n      is-grow-premium-popup=&quot;false&quot; \n  &gt;\n      &lt;component /&gt;\n    &lt;/a-badge&gt;\n\n</code></pre>\n<h4>Props</h4>\n<table>\n<thead>\n<tr>\n<th>Prop</th>\n<th>Type</th>\n<th>Description</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>title</code></td>\n<td><code>String</code></td>\n<td>Text label displayed inside the badge</td>\n</tr>\n<tr>\n<td><code>badge-position</code></td>\n<td><code>String</code></td>\n<td>Badge placement modifier (e.g. <code>top-right</code>, <code>top-left</code>, <code>bottom-left</code>, <code>bottom-right</code>)</td>\n</tr>\n<tr>\n<td><code>background-color</code></td>\n<td><code>String</code></td>\n<td>Background color of the badge</td>\n</tr>\n<tr>\n<td><code>text-color</code></td>\n<td><code>String</code></td>\n<td>Text color of the badge</td>\n</tr>\n<tr>\n<td><code>tailwind-classes</code></td>\n<td><code>String</code></td>\n<td>Tailwind utility classes for styling</td>\n</tr>\n<tr>\n<td><code>aria-label</code></td>\n<td><code>String</code></td>\n<td>Accessibility label for screen readers</td>\n</tr>\n<tr>\n<td><code>is-grow-premium-popup</code></td>\n<td><code>Boolean</code></td>\n<td>Indicates premium vs. non-premium rendering behavior</td>\n</tr>\n</tbody>\n</table>\n<table>\n<thead>\n<tr>\n<th>Key</th>\n<th>Type</th>\n<th>Required</th>\n<th>Description</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>Title</code></td>\n<td><code>String</code></td>\n<td>Yes</td>\n<td>Text label displayed inside the badge</td>\n</tr>\n<tr>\n<td><code>BadgePosition</code></td>\n<td><code>String</code></td>\n<td>Yes</td>\n<td>Badge placement modifier (e.g. <code>top-right</code>, <code>top-left</code>, <code>bottom-left</code>, <code>bottom-right</code>)</td>\n</tr>\n<tr>\n<td><code>BackgroundColor</code></td>\n<td><code>String</code></td>\n<td>No</td>\n<td>Background color of the badge</td>\n</tr>\n<tr>\n<td><code>TextColor</code></td>\n<td><code>String</code></td>\n<td>No</td>\n<td>Text color of the badge</td>\n</tr>\n<tr>\n<td><code>TailwindClasses</code></td>\n<td><code>String</code></td>\n<td>No</td>\n<td>Tailwind utility classes for styling</td>\n</tr>\n<tr>\n<td><code>AriaLabel</code></td>\n<td><code>String</code></td>\n<td>No</td>\n<td>Accessibility label for screen readers</td>\n</tr>\n<tr>\n<td><code>IsGrowPremium</code></td>\n<td><code>Boolean</code></td>\n<td>No</td>\n<td>Indicates premium vs. non-premium rendering behavior</td>\n</tr>\n</tbody>\n</table>\n<h4>Customization Example</h4>\n<pre><code class=\"language-json\">{\n  &quot;Localization&quot;: {\n    &quot;Data&quot;: {\n      &quot;Title&quot;: &quot;PREMIUM&quot;,\n      &quot;BadgePosition&quot;: &quot;top-right&quot;,\n      &quot;BackgroundColor&quot;: &quot;#FFE500&quot;,\n      &quot;TextColor&quot;: &quot;#000000&quot;,\n      &quot;TailwindClasses&quot;: &quot;text-xs font-bold uppercase&quot;,\n      &quot;AriaLabel&quot;: &quot;Premium Feature Badge&quot;,\n      &quot;IsGrowPremium&quot;: false\n    }\n  }\n}\n</code></pre>\n<h3>Component Behavior</h3>\n<h4>Grow Premium Logic</h4>\n<table>\n<thead>\n<tr>\n<th>Condition</th>\n<th>Behavior</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>isGrowPremiumPopup = false</code></td>\n<td>Component wrapper renders as a <code>&lt;div&gt;</code></td>\n</tr>\n<tr>\n<td><code>isGrowPremiumPopup = true</code></td>\n<td>Component wrapper renders as a <code>&lt;button&gt;</code> and clicking on button will open badge popup</td>\n</tr>\n</tbody>\n</table>\n<p>In case of <code>isGrowPremiumPopup = true</code>, clicking the button triggers an EventBus emit event &quot;showGrowPremiumSubscriptionPopup&quot;. This emit is listening by <code>&lt;o-badge-modal&gt;</code> component, which responds by toggling the subscription modal.</p>\n<h3>Accessibility &amp; UI issue handling</h3>\n<p>We copies all CSS classes from the first element inside the <code>&lt;a-badge&gt;</code> to the wrapper element. After copying, it removes those classes from the original element. This helps to ensure consistent styling.</p>\n<p>If the badge is not a Grow Premium badge <code>isGrowPremiumPopup = false</code>, We checks for all elements inside the slot container. It looks for <code>&lt;a&gt;</code>, <code>&lt;button&gt;</code>, and <code>&lt;article&gt;</code> tags, and replaces them with non-clickable versions (<code>&lt;span&gt;</code> or <code>&lt;div&gt;</code>), keeping their attributes and content the same. This is done to prevent nested interactive elements inside a button.</p>\n<h3>Example</h3>\n<p><a href=\"https://localhost:3030/?p=atoms-badge\">&lt;a-badge&gt;</a>\n<a href=\"https://localhost:3030/?p=pages-grow-badge\">pages-grow-badge</a></p>\n",

      "patternDesc": "<h2>Overview</h2>\n<p>The <code>&lt;a-badge&gt;</code> component is a flexible vue component designed to overlay a customizable badge on any other component.\nThis component can be used to indicate features such as premium content. It wraps the content in a <code>button</code> or <code>div</code> tag and conditionally converts any nested <code>button</code> or <code>a</code> tags into span elements, depending on whether the badge is considered a <strong>&quot;Grow Premium&quot;</strong> badge or not.</p>\n<ul>\n<li><code>&lt;a-badge&gt;</code> is a wrapper component and works with any component.</li>\n<li>Special behavior ( convert 'button', 'a' to span and 'article' tag to div) is applied when <code>IsGrowPremiumPopup</code> is <code>true</code> to enforce valid HTML semantics.</li>\n</ul>\n<hr>\n<h3>VueJs:</h3>\n<h4>Implementation with props</h4>\n<pre><code>  &lt;a-badge \n      aria-label=&quot;Premium Badge&quot; \n      background-color=&quot;#FFE500&quot; \n      badge-position=&quot;top-right&quot; \n      tailwind-classes=&quot;text-xs font-bold uppercase&quot; \n      text-color=&quot;#000000&quot;\n      title=&quot;PREMIUM&quot; \n      is-grow-premium-popup=&quot;false&quot; \n  &gt;\n      &lt;component /&gt;\n    &lt;/a-badge&gt;\n\n</code></pre>\n<h4>Props</h4>\n<table>\n<thead>\n<tr>\n<th>Prop</th>\n<th>Type</th>\n<th>Description</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>title</code></td>\n<td><code>String</code></td>\n<td>Text label displayed inside the badge</td>\n</tr>\n<tr>\n<td><code>badge-position</code></td>\n<td><code>String</code></td>\n<td>Badge placement modifier (e.g. <code>top-right</code>, <code>top-left</code>, <code>bottom-left</code>, <code>bottom-right</code>)</td>\n</tr>\n<tr>\n<td><code>background-color</code></td>\n<td><code>String</code></td>\n<td>Background color of the badge</td>\n</tr>\n<tr>\n<td><code>text-color</code></td>\n<td><code>String</code></td>\n<td>Text color of the badge</td>\n</tr>\n<tr>\n<td><code>tailwind-classes</code></td>\n<td><code>String</code></td>\n<td>Tailwind utility classes for styling</td>\n</tr>\n<tr>\n<td><code>aria-label</code></td>\n<td><code>String</code></td>\n<td>Accessibility label for screen readers</td>\n</tr>\n<tr>\n<td><code>is-grow-premium-popup</code></td>\n<td><code>Boolean</code></td>\n<td>Indicates premium vs. non-premium rendering behavior</td>\n</tr>\n</tbody>\n</table>\n<table>\n<thead>\n<tr>\n<th>Key</th>\n<th>Type</th>\n<th>Required</th>\n<th>Description</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>Title</code></td>\n<td><code>String</code></td>\n<td>Yes</td>\n<td>Text label displayed inside the badge</td>\n</tr>\n<tr>\n<td><code>BadgePosition</code></td>\n<td><code>String</code></td>\n<td>Yes</td>\n<td>Badge placement modifier (e.g. <code>top-right</code>, <code>top-left</code>, <code>bottom-left</code>, <code>bottom-right</code>)</td>\n</tr>\n<tr>\n<td><code>BackgroundColor</code></td>\n<td><code>String</code></td>\n<td>No</td>\n<td>Background color of the badge</td>\n</tr>\n<tr>\n<td><code>TextColor</code></td>\n<td><code>String</code></td>\n<td>No</td>\n<td>Text color of the badge</td>\n</tr>\n<tr>\n<td><code>TailwindClasses</code></td>\n<td><code>String</code></td>\n<td>No</td>\n<td>Tailwind utility classes for styling</td>\n</tr>\n<tr>\n<td><code>AriaLabel</code></td>\n<td><code>String</code></td>\n<td>No</td>\n<td>Accessibility label for screen readers</td>\n</tr>\n<tr>\n<td><code>IsGrowPremium</code></td>\n<td><code>Boolean</code></td>\n<td>No</td>\n<td>Indicates premium vs. non-premium rendering behavior</td>\n</tr>\n</tbody>\n</table>\n<h4>Customization Example</h4>\n<pre><code class=\"language-json\">{\n  &quot;Localization&quot;: {\n    &quot;Data&quot;: {\n      &quot;Title&quot;: &quot;PREMIUM&quot;,\n      &quot;BadgePosition&quot;: &quot;top-right&quot;,\n      &quot;BackgroundColor&quot;: &quot;#FFE500&quot;,\n      &quot;TextColor&quot;: &quot;#000000&quot;,\n      &quot;TailwindClasses&quot;: &quot;text-xs font-bold uppercase&quot;,\n      &quot;AriaLabel&quot;: &quot;Premium Feature Badge&quot;,\n      &quot;IsGrowPremium&quot;: false\n    }\n  }\n}\n</code></pre>\n<h3>Component Behavior</h3>\n<h4>Grow Premium Logic</h4>\n<table>\n<thead>\n<tr>\n<th>Condition</th>\n<th>Behavior</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>isGrowPremiumPopup = false</code></td>\n<td>Component wrapper renders as a <code>&lt;div&gt;</code></td>\n</tr>\n<tr>\n<td><code>isGrowPremiumPopup = true</code></td>\n<td>Component wrapper renders as a <code>&lt;button&gt;</code> and clicking on button will open badge popup</td>\n</tr>\n</tbody>\n</table>\n<p>In case of <code>isGrowPremiumPopup = true</code>, clicking the button triggers an EventBus emit event &quot;showGrowPremiumSubscriptionPopup&quot;. This emit is listening by <code>&lt;o-badge-modal&gt;</code> component, which responds by toggling the subscription modal.</p>\n<h3>Accessibility &amp; UI issue handling</h3>\n<p>We copies all CSS classes from the first element inside the <code>&lt;a-badge&gt;</code> to the wrapper element. After copying, it removes those classes from the original element. This helps to ensure consistent styling.</p>\n<p>If the badge is not a Grow Premium badge <code>isGrowPremiumPopup = false</code>, We checks for all elements inside the slot container. It looks for <code>&lt;a&gt;</code>, <code>&lt;button&gt;</code>, and <code>&lt;article&gt;</code> tags, and replaces them with non-clickable versions (<code>&lt;span&gt;</code> or <code>&lt;div&gt;</code>), keeping their attributes and content the same. This is done to prevent nested interactive elements inside a button.</p>\n<h3>Example</h3>\n<p><a href=\"https://localhost:3030/?p=atoms-badge\">&lt;a-badge&gt;</a>\n<a href=\"https://localhost:3030/?p=pages-grow-badge\">pages-grow-badge</a></p>\n",
