<div class="m-10">

  <o-cart-item sku="100" title="MelaPower® 9x Laundry Detergent" img-src="//cdnsc1.melaleuca.com/cdn-cgi/image/width&#x3D;65height&#x3D;120,quality&#x3D;85/global/products/6774589904.png" pdp-url="#" :quantity="1" line-id="1" :position="1" :user-flags='{"IsAuthenticated":true,"IsGuest":true,"ViewLists":true,"ViewMemberPricing":true,"ViewPoints":true}'>

    <template v-slot:info>
      Item 100 |
      $17.49 Preferred | 10 Points<br />
      $25.00 Regular | $7.51 Savings
    </template>

    <template v-slot:configurations>
      32 fl oz, Scent Free
    </template>

    <template v-slot:options="$options">
      32 fl oz, Scent Free <button type="button" class="o-cartItem__link -inline" @click="$options.edit">Edit</button>
    </template>

    <template v-slot:price>
      $17.49
    </template>

    <template v-slot:points>
      10 Points
    </template>

    <template v-slot:remove>
      Remove
    </template>

    <template v-slot:save>
      Save for later
    </template>

    <template v-slot:accessories>
      <!-- Start: Will eventually be hooked up as "add to cart" buttons -->
      <button type="button" class="o-cartItem__btn">NEED A PUMP? ADD TO CART</button>
      <!-- End: Will eventually be hooked up as "add to cart" buttons -->
    </template>

    <template v-slot:payment="$payment">
      <m-checkbox class="-cartItem" name="BuyWithLsd" label="Buy with Loyalty Shopping Dollars" @input="$payment.lsdPayment">
      </m-checkbox>

      <m-checkbox class="-cartItem" name="BuyWithCc" label="Use Convenience Certificates" @input="$payment.ccPayment">
      </m-checkbox>
    </template>

  </o-cart-item>

</div>
