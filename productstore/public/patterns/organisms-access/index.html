			{"cssEnabled":false,"patternLineageExists":false,"patternLineages":[],"lineage":[],"patternLineageRExists":false,"patternLineagesR":[],"lineageR":[],"patternLineageEExists":false,"patternDesc":"<h2>Overview</h2>\n<p>The Access organism is a Vue component controlling the pagination of the Create Account and Forgot Password form flows.</p>\n<h3>ADA:</h3>\n<ul>\n<li>After each step is transitioned in, the user's focus gets moved to the active step's container</li>\n<li>Individual Components\n<ul>\n<li><a href=\"/?p=molecules-account-email-phone\">Account - Email/Phone</a></li>\n<li><a href=\"/?p=molecules-account-enter-code\">Account - Enter Code </a></li>\n<li><a href=\"/?p=molecules-account-enter-code\">Account - Password</a></li>\n<li><a href=\"/?p=atoms-input-glimpse-password\">Input Glimpse Password</a></li>\n<li><a href=\"/?p=molecules-progress-bar\">Progress Bar</a></li>\n<li><a href=\"/?p=atoms-loading-spinner\">Loading Spinner</a></li>\n</ul>\n</li>\n</ul>\n<h3>VueJs:</h3>\n<h4>Implementation</h4>\n<p>Each step in the Vue component is automatically generated for each &lt;template v-slot:step-${id}&gt;&lt;template&gt; tag. The v-slot binding must be prefixed with &quot;step-&quot; and the Id of your step appended after. In this example we're using a numeration for Ids (0 - 3), but the Id string can be anything you want as long as they aren't duplicated. The order of steps will be the order in which they appear in the DOM.</p>\n<p>Each step also needs a corresponding progress bar step w/ text. Each one of these slot name needs to be prefixed with &quot;progress-step-${id}&quot; where ${id} is the matching form flow step id.</p>\n<p>There is also final progress bar step that doesn't correspond to a &quot;real&quot; form flow step in the Account Access flow. This is the &quot;Start Shopping&quot; step and icon. The text here can be defined within a &lt;template v-slot:progress-final&gt; element</p>\n<p>Note: The Access Link vue component can be used to navigate between steps. <a href=\"/?p=atoms-access-link\">Access Link</a></p>\n<h4>Props</h4>\n<ul>\n<li><strong>active-step</strong>\n<ul>\n<li>Type: String or Number</li>\n<li>Default: 0</li>\n<li>Step Id of whichever step should be currently visible</li>\n</ul>\n</li>\n<li><strong>active-text</strong>\n<ul>\n<li>Type: String</li>\n<li>Default: 'Current:'</li>\n<li>Hidden text to be used on the progress bar for screen reader users on the active step</li>\n</ul>\n</li>\n<li><strong>complete-text</strong>\n<ul>\n<li>Type: String</li>\n<li>Default: 'Complete:'</li>\n<li>Hidden text to be used on the progress bar for screen reader users on the completed step(s)</li>\n</ul>\n</li>\n</ul>\n","patternBreadcrumb":{"patternGroup":"organisms","patternSubgroup":"access"},"patternExtension":"hbs","patternName":"Access","patternPartial":"organisms-access","patternState":"","patternEngineName":"handlebars","extraOutput":{}}
