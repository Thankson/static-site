  <script type="text/json" id="pl-pattern-data-footer" class="pl-js-pattern-data">
    {
      "cssEnabled": false,

      "patternLineageEExists": false,
      "patternDesc": "<h2>General</h2>\n<p>Vue Product Carousel Cn component. This component can be used in any Chinese product carousel (shelf, page etc).</p>\n<p>a) Currently, this carousel is able to receive products through script tag and prop. FE needs to remove script tag option, keep prop option and add code to receive products using the new API (GET /api/carousel/product). Contract: https://dev.azure.com/melaleucait/Melaleuca/_git/DEP-Phase1?path=%2FMelaleuca%2FContracts%2FCarousels%2FgetProductCarousel.json&amp;version=GBmaster&amp;_a=contents\nb) FE will not check if the product is OffSale or SoldOut. BE will do that.\nc) FE needs to remove the request to SoldOut API.\nd) FE will not control the fallback carousel. BE will do that.\ne) Remove Reorder Carousel component and current API.\nf) Shelf is using product carousel as child component. For Add to Cart Shelf: get products from new API. For Add to BUO Shelf: get products from BUO API and pass to carousel using props.\ng) Get DatasourceId and NumberOfProducts from localization and use them as query string on new API.\nh) &lt;o-product-carousel&gt; is being used here:<br>\n- Sitecore pages/components (HomePage): products from script tag (change to new API)\n- Shelf Confirmation (Add to Cart): products from GET /api/carousel/getproductcarousel (remove current API and change to new API)\n- Shelf Confirmation (Add to BUO): products from POST /api/backuporder/cart (continue using it and pass product using prop)\n- Reorder Carousel: products from GET /api/carousel/reorderproductcarousel?datasourceId=X&amp;numberOfProducts=X (remove component and current API)\ni) Apply the same changes on Product Carousel China &lt;o-product-carousel-cn&gt;</p>\n<h2>Subcomponents</h2>\n<p><code>&lt;VueSlickCarousel&gt;</code>: This component uses &lt;VueSlickCarousel&gt; plugin to build the carousel. More information here: <a href=\"https://github.com/gs-shop/vue-slick-carousel\">VueSlickCarousel</a>.\n<code>&lt;m-product-card&gt;</code>: This component uses &lt;m-product-card&gt; as a subcomponent to render the product information.</p>\n<h2>Data exchange</h2>\n<h3>Labels</h3>\n<p>This component uses the data-driven standard to receive the labels. This is the expected object:</p>\n<pre><code class=\"language-json\">{\n    &quot;Localization&quot;: {\n        &quot;Labels&quot;: {\n            &quot;ProductCarousel&quot;: {\n                &quot;CardCta&quot;: &quot;Select&quot;,\n                &quot;CardCtaArialLabel&quot;: &quot;Add this product to card&quot;,\n                &quot;CarouselName&quot;: &quot;Products carousel for try our best sellers&quot;,\n                &quot;Item&quot;: &quot;Item&quot;,\n                &quot;Next&quot;: &quot;Next&quot;,\n                &quot;NextSlide&quot;: &quot;Next slide of products&quot;,\n                &quot;Of&quot;: &quot;Of&quot;,\n                &quot;Previous&quot;: &quot;Previous&quot;,\n                &quot;PreviousSlide&quot;: &quot;Previous slide of products&quot;,\n                &quot;Point&quot;: &quot;Point&quot;,\n                &quot;Points&quot;: &quot;Points&quot;,\n                &quot;RangeSR&quot;: &quot;to&quot;,\n                &quot;SeeAllLink&quot;: &quot;//productstore-qaus.melaleuca.com/&quot;,\n                &quot;SeeAllText&quot;: &quot;See All&quot;,\n                &quot;Slide&quot;: &quot;Slide&quot;,\n                &quot;Title&quot;: &quot;Try our best sellers&quot;,\n                &quot;ToolTipText&quot;: &quot;&lt;p class=\\&quot;font-bold leading-base pr-15 text-gray-150\\&quot; style=\\&quot;width:135px;\\&quot;&gt;Become a Preferred Member and Save 30–50%&lt;/p&gt;&lt;a class=\\&quot;block pt-20 text-green text-sm\\&quot;&gt;Get Started&lt;/a&gt;&quot;\n            }\n        }\n    }\n}\n</code></pre>\n<h3>Product data</h3>\n<p>This component uses the data-driven standard to receive the product data, but also uses the props o receive the data. So the product data can be passed by data-driven or props. This is the expected product data object:</p>\n<pre><code class=\"language-json\">{\n    &quot;Localization&quot;: {\n        &quot;Data&quot;: {\n            &quot;IsSignedIn&quot;: true,\n            &quot;IsPreferred&quot;: false,\n            &quot;ShowPrices&quot;: true,\n            &quot;ShowPoints&quot;: true,\n            &quot;Products&quot;: [\n                {\n                    &quot;Title&quot;: &quot;MelaSoft Fabric Softener 1&quot;,\n                    &quot;ItemId&quot;: &quot;8c280cd739bdc1d41de974e17654f349&quot;,\n                    &quot;StampMod&quot;: &quot;-redSolid&quot;,\n                    &quot;Stamp&quot;: &quot;New Product&quot;,\n                    &quot;Image&quot;: {\n                        &quot;Url&quot;: &quot;http://placehold.it/200x200&quot;,\n                        &quot;Alt&quot;: &quot;&quot;\n                    },\n                    &quot;PriceRange&quot;: {\n                        &quot;MinRegularPrice&quot;: &quot;$216.00&quot;,\n                        &quot;RawMinRegularPrice&quot;: 216,\n                        &quot;MaxRegularPrice&quot;: &quot;&quot;,\n                        &quot;RawMaxRegularPrice&quot;: null,\n                        &quot;ShowRangeForRegularPrice&quot;: false,\n                        &quot;MinPreferredPrice&quot;: &quot;$100.00&quot;,\n                        &quot;RawMinPreferredPrice&quot;: 100,\n                        &quot;MaxPreferredPrice&quot;: &quot;$72.00&quot;,\n                        &quot;RawMaxPreferredPrice&quot;: 72,\n                        &quot;ShowRangeForPreferredPrice&quot;: false,\n                        &quot;MinPoints&quot;: &quot;0&quot;,\n                        &quot;RawMinPoints&quot;: 0,\n                        &quot;MaxPoints&quot;: &quot;0&quot;,\n                        &quot;RawMaxPoints&quot;: 0,\n                        &quot;ShowRangeForPoints&quot;: false,\n                        &quot;PreferredMemberSavings&quot;: &quot;$4.
