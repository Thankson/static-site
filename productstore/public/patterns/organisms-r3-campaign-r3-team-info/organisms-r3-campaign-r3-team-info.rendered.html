  <script src="https://melaleuca-sandbox-desktop2.rallyware.com/grow-api/grow.js" type="text/javascript"></script>
  <script>
    var loadProfile = document.getElementsByClassName('o-loadProfile');

    if (loadProfile.length) {
      var loadProfileFooter = document.getElementsByClassName('o-loadProfile__footer')[0];
      var retryBtn = document.getElementsByClassName('o-loadProfile__retry');

      function showFooter() {
        loadProfileFooter.classList.remove('-isHidden');
      };

      if (retryBtn.length) {
        retryBtn[0].addEventListener('click', function(event) {
          window.location.reload();
        });
      }

      setTimeout(showFooter, 10000);
    }
  </script>
