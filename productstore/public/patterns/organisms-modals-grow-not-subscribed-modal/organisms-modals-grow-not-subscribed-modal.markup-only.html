<modal :heading-visible="false" :visible="true" data-testid="growNotSubscribedModal" width="531px" class="o-growNotSubscribedModal">
  <template #body>
    <h2 class="o-growNotSubscribedModal__heading">
      Not Subscribed to Grow
    </h2>
    <p class="o-growNotSubscribedModal__description">
      You are not currently subscribed to the Grow Suite. If you are interested in accessing this exclusive content, click below to go to the subscription page.
    </p>
  </template>

  <template #footer>
    <div class="o-growNotSubscribedModal__buttons">
      <a data-testid="growNotSubscribedModal__backButton" href="/" class="o-growNotSubscribedModal__button -bordered">
        Back
      </a>
      <a data-testid="growNotSubscribedModal__ctaButton" href="/subscription" class="o-growNotSubscribedModal__button">
        SUBSCRIBE TO GROW

      </a>
    </div>
  </template>

</modal>
