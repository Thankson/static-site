      "patternDesc": "<h1>AddressForm Component</h1>\n<h2>Description</h2>\n<p>The AddressForm component represents a form for capturing and validating shipping addresses. It provides a comprehensive set of input fields and functionality to handle address entry and validation for various countries.</p>\n<h2>Dependencies</h2>\n<p>The component imports the following components and mixins:</p>\n<ul>\n<li>AddressSearch</li>\n<li>FormFieldErrorMessage</li>\n<li>OAddressPaymethodPrompt</li>\n<li>addressFormLogic</li>\n<li>experianMixin</li>\n<li>phAddressFormMixin</li>\n<li>hkAddressFormMixin</li>\n<li>twAddressFormMixin</li>\n<li>localizationMixin</li>\n</ul>\n<p>It also imports utility functions and constants from various files.</p>\n<h2>Props</h2>\n<ul>\n<li><code>hasBusinessAddress</code> (Boolean, default: false): Indicates if the user has a business address already.</li>\n<li><code>hasShippingAddress</code> (Boolean, default: false): Indicates if the user has a shipping address already.</li>\n<li><code>isBusiness</code> (Boolean, default: false): Indicates if the form is for a business address.</li>\n<li><code>isInCheckout</code> (Boolean, default: false): Indicates if the form is used in the OLE checkout address flow.</li>\n<li><code>isRiverbendSubscription</code> (Boolean, default: false): Indicates if the form is used for a Riverbend subscription.</li>\n<li><code>restrictSuggestionInputToAddress</code> (Boolean, default: false): Restricts the suggestion input to only the address field.</li>\n<li><code>scriptId</code> (String, default: ''): The script ID associated with the form.</li>\n<li><code>showAddressEditView</code> (Boolean, default: false): Determines whether to show the address edit view.</li>\n<li><code>showBusinessAddForm</code> (Boolean, default: false): Determines the visibility of the business address form.</li>\n<li><code>showShippingAddForm</code> (Boolean, default: true): Determines the visibility of the shipping address form.</li>\n</ul>\n<h2>Data</h2>\n<p>The component's data includes various properties for storing form field values, validation errors, and other related data. Some notable data properties include:</p>\n<ul>\n<li><code>chosenCountry</code>: The currently selected country.</li>\n<li><code>addressShipping</code>: The final object with shipping address data.</li>\n<li><code>isLoadingSubmitForm</code>: Indicates if the form submission is in progress.</li>\n<li><code>isValidatedByServicesApi</code>: Indicates if the address is validated by the services API.</li>\n<li><code>listError</code>: An array to store form errors.</li>\n</ul>\n<h2>Computed Properties</h2>\n<p>The component has several computed properties that derive values based on the current state of the form and localization data. Some notable computed properties include:</p>\n<ul>\n<li><code>addressEntered</code>: Returns the currently entered address data.</li>\n<li><code>addressEnteredFormatted</code>: Returns the formatted version of the entered address.</li>\n<li><code>apiExperianError</code>: Alias for the <code>apiError</code> property from the Experian mixin.</li>\n<li><code>isEurope</code>: Indicates if the selected country is in Europe.</li>\n<li><code>isPhilippines</code>, <code>isHongkong</code>, <code>isTaiwan</code>, etc.: Indicate if the selected country is the respective country.</li>\n<li><code>optionalFields</code>: Returns an array of optional fields based on the selected country.</li>\n<li><code>showFields</code>: Returns an array of fields to display based on the selected country.</li>\n</ul>\n<h2>Methods</h2>\n<p>The component has several methods that handle form submission, validation, and other related functionality. Some notable methods include:</p>\n<ul>\n<li><code>checkSave</code>: Handles the form submission and performs necessary validations and API calls.</li>\n<li><code>choseAddress</code>: Handles the selection of an address from the suggestions.</li>\n<li><code>openCrossCountryAddress</code>: Opens the cross-country address modal.</li>\n<li><code>setPrefilledData</code>: Sets the prefilled data for the form fields.</li>\n<li><code>submitAddress</code>: Submits the address form and performs necessary API calls and validations.</li>\n<li><code>validateWithApi</code>: Validates the address using the services API.</li>\n</ul>\n<h2>Template</h2>\n<p>The template of the component includes the following sections:</p>\n<ul>\n<li>Country Select</li>\n<li>Name Input</li>\n<li>Company Name Input (for business or Singapore)</li>\n<li>Address Search (for Korea and Japan)</li>\n<li>Address 1 Input</li>\n<li>Address 2 Input</li>\n<li>Address 3 Input (for Mexico and Malaysia)</li>\n<li>City Input</li>\n<li>State/Province Select</li>\n<li>Postal Code Input</li>\n<li>Phone Number Input</li>\n<li>Delivery Instructions Textarea</li>\n<li>Default Shipping Checkbox</li>\n<li>Cancel and Save Buttons</li>\n<li>Cross-Country Address Modal</li>\n<li>Error Messages</li>\n</ul>\n<p>The template heavily relies on conditional rendering based on the selected country and form state.</p>\n<h2>Lifecycle Hooks</h2>\n<ul>\n<li><code>mounted</code>: Initializes the component by fetching address data, setting the initial country, and prefilling form data.</li>\n<li><code>watch</code>: Watches for changes in the form fields and performs necessary validations and API calls.</li>\n</ul>\n<h2>Validation</h2>\n<ul>\n<li>There are 2 validations:\n<ul>\n<li>Vuelidate Validator: checks if the mandatory fields are filled properly.</li>\n<li>Experian service: checks if the address exists.</li>\n</ul>\n</li>\n<li>The modal uses the component m-modal: <code>productstore &gt; source &gt; js &gt; vue &gt; components &gt; 01-molecules &gt; modal &gt; experian-modal.vue</code></li>\n<li>This form uses <strong>Experian</strong> API for validation.</li>\n<li>There is 2 endpoints: one for USA/CAN and one for MEX/Rest of World.</li>\n<li>USA and Canada use the V1: <a href=\"https://www.edq.com/documentation/apis/address-validate/experian-address-validation/\">Click to see the documentation</a></li>\n<li>For Mexico and Rest of World, it uses the <strong>Global Intuitive</strong> (V.2) version: <a href=\"https://www.edq.com/documentation/apis/address-validate/global-intuitive/\">Click to see the documentation</a></li>\n<li>The modal gets information from the div <strong>&quot;hidden-answers&quot;</strong>. This is used for translation purposes.\n<img src=\"./images/pattern-lab/address-form_hidden-answers.jpg\" alt=\"hidden answers\"></li>\n<li>View the wiki for even more documentation about the experian service.</li>\n</ul>\n<h3>Validation Steps</h3>\n<ul>\n<li>The field <strong>ADDRESS 1</strong> has a listener to every typed letter.</li>\n<li>If exceeds 3 letters (this number can be changed) the API is call and it adds a list of suggestions.</li>\n<li>The user can pick a suggestion or continue typing.</li>\n<li>On hit Save button, if the address does not match with the previous suggestions, the modal appears showing again the address suggestions.</li>\n<li>Users can choose one suggestion or just accept what was typed.</li>\n</ul>\n<h2>General Notes</h2>\n<ul>\n<li>The cancel button should navigate the user back to the previous page without saving.</li>\n<li>A list of errors, if any, appears at the bottom of the form (more detail below).</li>\n<li>When an error field is fixed and goes out of the focus, the correspondent error at the bottom list will disappear.</li>\n<li>After saving the form, the page is redirected to the previous page.</li>\n</ul>\n<h3>To add a new country</h3>\n<ul>\n<li>\n<p>Update the computed values:</p>\n<ul>\n<li>addressEntered</li>\n<li>addressFields</li>\n<li>phoneNumberPlaceholder</li>\n<li>showFields</li>\n</ul>\n</li>\n<li>\n<p>Update the validation with the required fields for each country:</p>\n<ul>\n<li>If you need to update the phone number validations, look at the form-helper.js at the function isValidPhoneNumber and update it for each culture (or reuse one that is there for your new country)</li>\n</ul>\n</li>\n<li>\n<p>Update in the experian.js file, the the function getAddressApi, the country codes (you may have to check experian documentation, at the top of the experian.js file, to get a country code)</p>\n</li>\n</ul>\n<h3>To add a new field</h3>\n<ul>\n<li>\n<p>Add to prop:</p>\n</li>\n<li>\n<p>{field}Prop</p>\n</li>\n<li>\n<p>Add to data:</p>\n</li>\n<li>\n<p>{field}Data,</p>\n</li>\n<li>\n<p>{field}DataError</p>\n</li>\n</ul>\n<h3>To clear the field after switching countries</h3>\n<ul>\n<li>Reset the field data to blank in the function selectedCountry</li>\n</ul>\n<hr>\n<p>Overall, the AddressForm component provides a comprehensive solution for capturing and validating shipping addresses for various countries. It integrates with external APIs, handles form validation, and provides a user-friendly interface for address entry and selection.</p>\n",
