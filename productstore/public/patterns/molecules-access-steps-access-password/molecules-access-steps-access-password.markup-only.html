<m-access-password confirm-password-placeholder="Re-enter New Password" new-password-placeholder="Enter New Password" :password-criteria='{"Case":"UPPER and lower case","Number":"At least one number","QtityChar":"8 or more characters","Title":"Your Password must include:"}' :handler="() => true">

  <template v-slot:heading>
    Update Password
  </template>

  <template v-slot:new-password-label>
    NEW PASSWORD
  </template>

  <template v-slot:new-password-error>
    Please enter your new password
  </template>

  <template v-slot:criteria-error>
    Your new password does not<br class="hidden md:block" /> meet the necessary criteria.<br /> Please try again.
  </template>

  <template v-slot:confirm-password-label>
    CONFIRM PASSWORD
  </template>

  <template v-slot:confirm-password-error>
    Please confirm your new password
  </template>

  <template v-slot:match-error>
    Your passwords do not match.
  </template>

  <template v-slot:api-error>
    Something unexpected happened with your request. Please try again. If the problem persist please call Customer Support at 1-800-742-2444.
  </template>

  <template v-slot:button-label>
    Update Password
  </template>

  <template v-slot:skip-text>
    Skip this step
  </template>

  <template v-slot:skip-tooltip>
    Selecting &quot;SKIP this step&quot; will provide you a temporary shopping pass, good for three hours. Your password will remain unchanged.
  </template>

</m-access-password>
