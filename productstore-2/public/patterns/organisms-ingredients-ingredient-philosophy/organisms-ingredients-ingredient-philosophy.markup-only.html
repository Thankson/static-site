        "RTE": "<div class=\"m-rte\"><div class=\"mx-auto w-full\" style=\"max-width:870px\"><h3 class=\"block leading-tight text-gray-150 text-xl w-full\">Naturally safe ingredients are our priority. The best naturally <span class=\"lg:block lg:mb-0\">derived and plant-derived ingredients may cost a little more, but </span><span class=\"lg:block lg:mb-0\">we take pride in investing in what matters most.</span></h3><ul class=\"mt-40 lg:flex lg:justify-between\"><li class=\"list-none my-20 pt-20 lg:even:px-30 lg:w-1_3 lg:my-0\"> <span role=\"text\" class=\"block border-t border-gray-150 pt-20 w-full\"><p class=\"leading-tight text-gray-150 text-sm w-full\"><span class=\"font-bold uppercase\">Fragrance</span> A properly selected, safe fragrance brings a sense of clean to bathrooms and laundry and a sense of enjoyment to lotions and shampoos. We only select high-quality essential and fragrance oils that are guaranteed to meet our Safe Scent® standard, and meet the International Fragrance Association (IFRA) standards that protect against levels of irritation and sensitivity and must be free from contaminants. They undergo stringent testing for purity, quality, and all leave-on products undergo third-party sensitivity testing with a certified dermatologist. If it’s not safe, we won’t use it.</p> </span></li><li class=\"list-none my-20 pt-20 lg:even:px-30 lg:w-1_3 lg:my-0\"> <span role=\"text\" class=\"block border-t border-gray-150 pt-20 w-full\"><p class=\"leading-tight text-gray-150 text-sm w-full\"><span class=\"font-bold uppercase\">Colorants</span> Color makes life better, enhances emotional mood, and makes our world more appealing. Color and safety go hand-in-hand. We use only safe colorants that are non-toxic and won’t accumulate in the environment. We select colors with the highest safety profiles for our home and personal care products. All are batch certified, have been thoroughly tested to be free of impurities and contaminants, and are Food, Drug & Cosmetic (FD&C) certified by the US Food & Drug Administration (FDA).</p> </span></li><li class=\"list-none my-20 pt-20 lg:w-1_3 lg:my-0\"> <span role=\"text\" class=\"block border-t border-gray-150 pt-20 w-full\"><p class=\"leading-tight text-gray-150 text-sm w-full\"><span class=\"font-bold uppercase\">Preservatives</span> Without proper preservatives, many natural products degrade quickly and can easily become home to mold and bacteria. The solution to keeping natural products fresh and safe is to add proven, safe, and effective preservatives. As of today, there are no effective plant-derived preservatives. If one were available, we would use it. In the meantime, we select the safest, most effective preservatives that allow us to use the tiniest amounts possible. We never use cheaper preservatives known to cause health issues such as formaldehyde or parabens.</p> </span></li></ul></div></div>",
