<article class="m-fwBanner -h-lg -slide -stackMobile    " data-testid="article-fullWidthBanner">
  <div class="m-fwBanner__row -media -mobileBgVid">
    <!-- Start: Media block1 -->
    <!-- images -->

    <picture class="a-genImg">



      <source srcset="https://placehold.co/768x550.jpg" media="(max-width: 575px)">

      <!-- Default/Fallback image Should be the desktop image -->
      <img src="" alt="Alternative text for image on desktop" class="a-genImg__img object-top" fetchpriority="high">
    </picture>

    <!-- Video -->
    <div class="m-fwBanner__bgVideo">
      <video muted autoplay loop poster="https://placehold.co/1920x380" aria-label="Some descrition for the desktop video.">
        <source src="//video-us.melaleuca.com/renew/renew_bkg_video_noaudio.webm" type="video/webm" />
        <source src="//video-us.melaleuca.com/renew/renew_bkg_video_noaudio.mp4" type="video/mp4" />
      </video>
      <div class="a-playPause" data-js="playPauseBlock">
        <button type="button" class="a-playPause__action -right -bottom -bgVideo" aria-pressed="false" aria-label="Toggle to Play or Pause Renew background video" data-js="playPause" data-descr-pause="Pause video" data-descr-play="Play video" data-label-pause="Pause Renew background video" data-label-play="Play Renew background video">
          <span class="a-playPause__icon font-material" data-js="playPauseIcon">pause_circle_filled</span>
          <span class="a-playPause__description" data-js="playPauseDescr">Pause video</span>
        </button>
      </div>
    </div>
    <!-- End: Media block -->
  </div>
  <div class="m-fwBanner__row -columns -w-lg -left -top">
    <!-- Start: Content block -->
    <div class="m-fwBanner__columns ">
      <div class="m-fwBanner__col -content">
        <div class="m-fwBanner__rte">
          <div class="m-rte">
            <h1 class="text-3xl font-bold uppercase mb-4"><span class="uppercase font-bold text-green block "> Concentrated</span> for the environment.</h1>
            <p> Est officia cupidatat commodo eu enim dolore veniam adipisicing sit id ea sunt do eu.Sunt voluptate occaecat commodo nisi Lorem dolore.Et eu cillum nisi elit aute duis eu pariatur sint. </p>
          </div>
        </div>

        <div class="m-fwBanner__cta -left">
          <a class="a-authorBtn  text-center   bg-green rounded -default  px-40 " style="color: " href="#">Learn More</a>
        </div>




      </div>



    </div>
    <!-- End: Content block -->
  </div>
</article>
