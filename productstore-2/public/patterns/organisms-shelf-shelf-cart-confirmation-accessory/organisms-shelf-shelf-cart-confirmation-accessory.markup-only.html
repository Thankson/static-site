<shelf :visible="true" :show-heading="false">
  <div class="o-shelfCart">
    <h2 id="global-shelf-heading" class="o-shelfCart__heading -hasIcon">
      <a-icon class="o-shelfCart__icon">check</a-icon>
      <span role="text">
        Added to Cart

      </span>

    </h2>

    <div class="m-shelfConfirm">
      <div class="m-shelfConfirm__summary">
        <div class="m-shelfConfirm__imgWrapper">
          <img class="m-shelfConfirm__img" src="//cdnsc1.melaleuca.com/cdn-cgi/image/width&#x3D;120height&#x3D;120,quality&#x3D;85/global/products/4970245007.png" alt="" />
        </div>
        <div class="m-shelfConfirm__details">
          <a id="cartProductName" class="m-shelfConfirm__product -link" href="#">EcoSense Laundry 4-Pack</a>
          <dl class="m-shelfConfirm__list" aria-labelledby="cartProductName">
            <dt class="m-shelfConfirm__title">Item Price:</dt>
            <dd class="m-shelfConfirm__desc">$43.30</dd>
            <dt class="m-shelfConfirm__title">Points:</dt>
            <dd class="m-shelfConfirm__desc">20</dd>
            <dt class="m-shelfConfirm__title">Qty:</dt>
            <dd class="m-shelfConfirm__desc">1</dd>
          </dl>
        </div>
      </div>

      <dl class="m-shelfConfirm__subtotal">
        <dt class="m-shelfConfirm__title -subtotal">Cart Subtotal</dt>
        <dd class="m-shelfConfirm__total -price">$43.30</dd>
        <dt class="m-shelfConfirm__title -subtotal">Cart Points</dt>
        <dd class="m-shelfConfirm__total">20 Points</dd>
      </dl>

      <div class="m-shelfConfirm__actions -mx-5">

        <a class="a-button -white -center flex-1 mx-5" href="#">View Cart</a>

        <a class="a-button -center flex-1 mx-5" href="#">Keep Shopping</a>
      </div>


    </div>
    <div class="m-shelfAccessory">
      <div class="m-shelfAccessory__details">
        <h3 class="m-shelfAccessory__heading">You’ll Need a New Pump</h3>
        <p class="m-shelfAccessory__desc">32 fl oz Reusable Laundry Pump</p>
      </div>
      <div class="m-shelfAccessory__fill">
        <img src="//cdnsc1.melaleuca.com/cdn-cgi/image/width&#x3D;68height&#x3D;68,quality&#x3D;85/global/products/678572813.png" alt="You’ll Need a New Pump" class="m-shelfAccessory__img">
      </div>
      <div class="m-shelfAccessory__controls">
        <button type="button" class="m-shelfAccessory__btn" aria-label="Add to Cart">
          <a-icon size="inherit">add</a-icon>
          <a-icon size="inherit">shopping_cart</a-icon>
        </button>
      </div>
    </div>
  </div>
</shelf>
