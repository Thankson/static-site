          "Modal": {
            "Heading": "Customer Membership Agreement Terms & Conditions",
            "Body": "<ol><li class=\"pb-15\"><span class=\"font-bold\">1. Payment Authorization:</span> I authorize Melaleuca to charge my credit card or debit the bank account specified in this Agreement for orders I place directly and for any Backup Order. If Melaleuca is unable to collect payment in full from my credit card, I authorize Melaleuca to make multiple attempts to collect for up to 90 days. I agree to pay a $10.00 service fee if a check or charge is dishonored for any reason. I will hold Melaleuca harmless for all special or consequential damages, whether direct or indirect, resulting from any wrongful debit to my account.</li><li class=\"pb-15\"><span class=\"font-bold\">2. Convenience Certificate Redemption:</span> After I have been a Member for six months, I may select Convenience Certificates as my Backup Order and may receive Convenience Certificates as otherwise provided in this Agreement. If I do not redeem a Convenience Certificate within 12 months, the unredeemed balance will be converted to a credit on my account, subject to the terms in the Satisfaction Guarantee paragraph below. Convenience Certificates may be redeemed for product or credit on account, but may not be returned for cash except in certain states.</li><li class=\"pb-15\"><span class=\"font-bold\">3. Resale of Products:</span> I understand Melaleuca’s commitment to product freshness, product safety, and product quality; therefore, I agree that I will not offer Melaleuca products for sale or resale. This obligation will continue even after this Agreement is canceled. Melaleuca shall have the right to prevent any such offers by legal action and, to the extent permitted by law, I will be obligated to pay Melaleuca’s legal fees and costs in connection with any such legal action based upon my violation of this obligation.</li><li class=\"pb-15\"><span class=\"font-bold\">4. Term:</span> The term of this Agreement is one year. This Agreement automatically renews annually on each anniversary date and will remain in effect until: (1) I submit a new signed Customer Membership Agreement, (2) I cancel this Agreement pursuant to the cancellation rights notice herein, or (3) Melaleuca cancels this Agreement upon written notice to me at my address set forth herein, which I agree Melaleuca may do at any time in its sole discretion.</li><li class=\"pb-15\"><span class=\"font-bold\">5. Satisfaction Guarantee:</span> If I am not completely satisfied with any product I purchase from Melaleuca, I may return the unused portion of the product together with a copy of the purchase receipt to Melaleuca within 90 days of the date of purchase and Melaleuca will credit my customer account for the total purchase price of the product. If I have unredeemed credit on my customer account, Melaleuca may make efforts to locate me and advise me in writing of the credit. Melaleuca may continue to make such attempts on a monthly basis and will charge my customer account a $10 service fee for each month’s notification process for as long as I have a credit on account, unless otherwise restricted or prohibited by law.</li><li class=\"pb-15\"><span class=\"font-bold\">6. Refused Orders:</span> If I refuse to accept any products delivered to me in accordance with Melaleuca’s Customer Membership Agreement Terms and Conditions, any future Backup Order Melaleuca sends to me will be a Convenience Certificate of equal value that I can redeem within 12 months at my convenience.</li><li class=\"pb-15\"><span class=\"font-bold\">7. Dispute Resolution:</span> To the extent permitted by applicable law, and unless otherwise expressly agreed to in writing, all claims or disputes of any nature between one or more current or former Customers and Melaleuca (or its officers, shareholders, or employees), if not resolved by mutual agreement, shall be resolved by binding arbitration. Judgment on an award rendered by the arbitrator may be entered in any court having jurisdiction. All issues are for the arbitrator to decide consistent with this Agreement, including issues relating to the scope and enforceability of the arbitration provision, and the arbitrator shall have the power to award damages and injunctive relief. If the costs of arbitration will be prohibitive as compared to the costs of litigation, I agree that Melaleuca will be allowed to pay as much of the filing and hearing fees in connection with the arbitration as the arbitrator deems necessary to prevent the arbitration from being cost-prohibitive. MELALEUCA AND I AGREE THAT EACH PARTY MAY BRING CLAIMS AGAINST THE OTHER ONLY IN AN INDIVIDUAL CAPACITY AND NOT AS A PLAINTIFF OR CLASS MEMBER IN ANY PURPORTED CLASS OR REPRESENTATIVE PROCEEDING OR IN ANY PROCEEDING THAT CONSOLIDATES MORE THAN ONE PERSON’S CLAIMS. MELALEUCA AND I ALSO AGREE THAT, BY ENTERING INTO THIS AGREEMENT, EACH PARTY IS WAIVING THE RIGHT TO A TRIAL BY JURY FOR ALL CLAIMS SUBJECT TO BINDING ARBITRATION. All arbitration hearings shall take place in the State of Idaho. This Agreement shall be governed by the laws of the State of Idaho and the Federal Arbitration Act (“FAA”). If any conflict exists between Idaho law and the FAA, the FAA will govern. This arbitration provision, in whole or in part, shall survive termination, cancellation, or suspension of this Agreement or any provision of this paragraph. In reaching its decision, the arbitrator or the court (a) shall not interpret the meaning of this Agreement or the intent of the parties with respect thereto by reference to any written or oral communications, course of dealing, or extraneous documents or information other than the express terms of this Agreement, as expressly and specifically amended or waived by Melaleuca in accordance with this Agreement; and (b) shall consider Melaleuca’s interpretations of the Melaleuca Agreements (including interpretations of any ambiguous provisions) as final and binding unless such interpretation is shown to be unreasonable by clear and convincing evidence.</li><li class=\"pb-15\"><span class=\"font-bold\">8. Personal Information:</span> I consent to the lawful use by Melaleuca of the personal information contained on this form and information regarding my purchases from Melaleuca, including the disclosure of such content and information to my enroller and his or her Support Team.</li><li class=\"pb-15\"><span class=\"font-bold\">9. Amendments:</span> Upon 30 days notice to Customers, Melaleuca may, at its sole discretion, amend this Customer Membership Agreement. By signing this Agreement, I agree to abide by any and all such amendments and that my only remedy for not accepting any such amendments is to cancel this Agreement prior to the conclusion of the 30-day notification period. My placing of an order 30 days after Melaleuca sends written notice of any amendment will constitute my acceptance of the amendment. I agree that Melaleuca’s interpretation of the Melaleuca Agreements will be final and binding.</li></ol>",
