sary date and will remain in effect until: (1) I submit a new signed Customer Membership Agreement, (2) I cancel this Agreement pursuant to the cancellation rights notice herein, or (3) Melaleuca cancels this Agreement upon written notice to me at my address set forth herein, which I agree Melaleuca may do at any time in its sole discretion.</li><li class=\"pb-15\"><span class=\"font-bold\">5. Satisfaction Guarantee:</span> If I am not completely satisfied with any product I purchase from Melaleuca, I may return the unused portion of the product together with a copy of the purchase receipt to Melaleuca within 90 days of the date of purchase and Melaleuca will credit my customer account for the total purchase price of the product. If I have unredeemed credit on my customer account, Melaleuca may make efforts to locate me and advise me in writing of the credit. Melaleuca may continue to make such attempts on a monthly basis and will charge my customer account a $10 service fee for each month’s notification process for as long as I have a credit on account, unless otherwise restricted or prohibited by law.</li><li class=\"pb-15\"><span class=\"font-bold\">6. Refused Orders:</span> If I refuse to accept any products delivered to me in accordance with Melaleuca’s Customer Membership Agreement Terms and Conditions, any future Backup Order Melaleuca sends to me will be a Convenience Certificate of equal value that I can redeem within 12 months at my convenience.</li><li class=\"pb-15\"><span class=\"font-bold\">7. Dispute Resolution:</span> To the extent permitted by applicable law, and unless otherwise expressly agreed to in writing, all claims or disputes of any nature between one or more current or former Customers and Melaleuca (or its officers, shareholders, or employees), if not resolved by mutual agreement, shall be resolved by binding arbitration. Judgment on an award rendered by the arbitrator may be entered in any court having jurisdiction. All issues are for the g evidence.</li><li class=\"pb-15\"><span class=\"font-bold\">8. Personal Information:</span> I consent to the lawful use by Melaleuca of the personal information contained on this form and information regarding my purchases from Melaleuca, including the disclosure of such content and information to my enroller and his or her Support Team.</li><li class=\"pb-15\"><span class=\"font-bold\">9. Amendments:</span> Upon 30 days notice to Customers, Melaleuca may, at its sole discretion, amend this Customer Membership Agreement. By signing this Agreement, I agree to abide by any and all such amendments and that my only remedy for not accepting any such amendments is to cancel this Agreement prior to the conclusion of the 30-day notification period. My placing of an order 30 days after Melaleuca sends written notice of any amendment will constitute my acceptance of the amendment. I agree that Melaleuca’s interpretation of the Melaleuca Agreements will be final and binding.</li></ol>",
