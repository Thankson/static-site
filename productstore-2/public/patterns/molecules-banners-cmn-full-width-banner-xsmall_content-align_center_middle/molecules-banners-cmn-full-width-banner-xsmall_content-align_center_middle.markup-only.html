    <picture class="a-genImg">
      <source srcset="https://placehold.co/1440x380.jpg" media="(min-width: 1024px)">



      <source srcset="https://placehold.co/768x550.jpg" media="(max-width: 575px)">

      <!-- Default/Fallback image Should be the desktop image -->
      <img src="https://placehold.co/1440x380.jpg" alt="Alternative text for image on desktop" class="a-genImg__img object-top" fetchpriority="high">
    </picture>

    <!-- End: Media block -->

          <a class="a-authorBtn  text-center   bg-green rounded -default  px-40 " style="color: " href="#">Learn More</a>
