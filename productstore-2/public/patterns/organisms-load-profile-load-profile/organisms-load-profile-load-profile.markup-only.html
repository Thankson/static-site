<article class="o-loadProfile">
  <div class="o-loadProfile__card">
    <header class="o-loadProfile__header">
      <img src="/images/logos/melaleuca-logo-full-color.png" class="o-loadProfile__logo" alt="Melaleuca Company logo">
      <h1 class="o-loadProfile__title">Loading Profile...</h1>
    </header>
    <div class="o-loadProfile__body">
      <div class="o-loadProfile__spinner">
      </div>
    </div>
    <footer class="o-loadProfile__footer -isHidden">
      <p class="o-loadProfile__text">Looks like its taking a while.</p>
      <button class="o-loadProfile__retry">Try Again</button>
    </footer>
  </div>
</article>
