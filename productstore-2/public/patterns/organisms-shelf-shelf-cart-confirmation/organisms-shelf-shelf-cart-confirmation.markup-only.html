<shelf :visible="true" :show-heading="false">
  <div class="o-shelfCart">
    <h2 id="global-shelf-heading" class="o-shelfCart__heading -hasIcon">
      <a-icon class="o-shelfCart__icon">check</a-icon>
      <span role="text">
        Added to Cart

      </span>

    </h2>

    <div class="m-shelfConfirm">
      <div class="m-shelfConfirm__summary">
        <div class="m-shelfConfirm__imgWrapper">
          <img class="m-shelfConfirm__img" src="//cdnsc1.melaleuca.com/cdn-cgi/image/width&#x3D;120height&#x3D;120,quality&#x3D;85/global/products/1800846134.png" alt="" />
        </div>
        <div class="m-shelfConfirm__details">
          <a id="cartProductName" class="m-shelfConfirm__product -link" href="#">Renew&reg; with PURE&trade; Lavender</a>
          <dl class="m-shelfConfirm__list" aria-labelledby="cartProductName">
            <dt class="m-shelfConfirm__title">Item Price:</dt>
            <dd class="m-shelfConfirm__desc">$9.99</dd>
            <dt class="m-shelfConfirm__title">Points:</dt>
            <dd class="m-shelfConfirm__desc">1</dd>
            <dt class="m-shelfConfirm__title">Qty:</dt>
            <dd class="m-shelfConfirm__desc">1</dd>
          </dl>
        </div>
      </div>

      <dl class="m-shelfConfirm__subtotal">
        <dt class="m-shelfConfirm__title -subtotal">Cart Subtotal</dt>
        <dd class="m-shelfConfirm__total -price">$9.99</dd>
        <dt class="m-shelfConfirm__title -subtotal">Cart Points</dt>
        <dd class="m-shelfConfirm__total">6 Points</dd>
      </dl>

      <div class="m-shelfConfirm__actions -mx-5">

        <a class="a-button -white -center flex-1 mx-5" href="#">View Cart</a>

        <a class="a-button -center flex-1 mx-5" href="#">Keep Shopping</a>
      </div>


    </div>
  </div>
</shelf>
