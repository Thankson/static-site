      "patternDesc": "<h2>General</h2>\n<p>Vue Product Carousel component. This component can be used in any product carousel (shelf, page etc).</p>\n<h2>Subcomponents</h2>\n<p><code>&lt;VueSlickCarousel&gt;</code>: This component uses &lt;VueSlickCarousel&gt; plugin to build the carousel. More information here: <a href=\"https://github.com/gs-shop/vue-slick-carousel\">VueSlickCarousel</a>.\n<code>&lt;m-product-card&gt;</code>: This component uses &lt;m-product-card&gt; as a subcomponent to render the product information.</p>\n<h2>Data exchange</h2>\n<h3>Labels and UserFlags</h3>\n<p>This component uses the data-driven standard to receive the labels. This is the expected object:</p>\n<pre><code class=\"language-json\">{\n    &quot;Localization&quot;: {\n        &quot;Labels&quot;: {\n            &quot;ProductCarousel&quot;: {\n                &quot;CardCta&quot;: &quot;Select&quot;,\n                &quot;CardCtaArialLabel&quot;: &quot;Add this product to card&quot;,\n                &quot;Item&quot;: &quot;Item&quot;,\n                &quot;Next&quot;: &quot;Next&quot;,\n                &quot;NextSlide&quot;: &quot;Next slide of products&quot;,\n                &quot;Of&quot;: &quot;Of&quot;,\n                &quot;Previous&quot;: &quot;Previous&quot;,\n                &quot;PreviousSlide&quot;: &quot;Previous slide of products&quot;,\n                &quot;Point&quot;: &quot;Point&quot;,\n                &quot;Points&quot;: &quot;Points&quot;,\n                &quot;RangeSR&quot;: &quot;to&quot;,\n                &quot;SeeAllLink&quot;: &quot;//productstore-qaus.melaleuca.com/&quot;,\n                &quot;SeeAllText&quot;: &quot;See All&quot;,\n                &quot;Slide&quot;: &quot;Slide&quot;,\n                &quot;FallbackTitle&quot;: &quot;Try our best sellers&quot;,\n                &quot;FallbackCarouselName&quot;: &quot;Products carousel for try our best sellers&quot;,\n                &quot;ToolTipText&quot;: &quot;&lt;p class=\\&quot;font-bold leading-base pr-15 text-gray-150\\&quot; style=\\&quot;width:135px;\\&quot;&gt;Become a Preferred Member and Save 30–50%&lt;/p&gt;&lt;a class=\\&quot;block pt-20 text-green text-sm\\&quot;&gt;Get Started&lt;/a&gt;&quot;\n            }\n        },\n        &quot;Data&quot;: {\n            &quot;DatasourceId&quot;: null,\n            &quot;NumberOfProducts&quot;: 0,\n            &quot;ShowPoints&quot;: true,\n            &quot;ShowPrices&quot;: true,\n            &quot;UserFlags&quot;: {\n                &quot;IsGuestShoppingEnabled&quot;: false,\n                &quot;IsGuest&quot;: false,\n                &quot;IsAuthenticated&quot;: true,\n                &quot;ViewLists&quot;: true,\n                &quot;ViewMemberPricing&quot;: true,\n                &quot;ViewPoints&quot;: true\n            }\n        }\n    }\n}\n</code></pre>\n<h3>Product data</h3>\n<p>This component uses Product Carousel API to get product data, but also uses the props o receive the data.</p>\n<h3>Carousel Settings</h3>\n<p>This component uses props to receive the carousel settings. If this prop is empty, the component will use a default/hardcoded settings.</p>\n<h3>Slots</h3>\n<p>This component is prepared to receive some information using slots:</p>\n<p><code>title</code>: This slot can be used to render a custom markup for the title. Example:</p>\n<pre><code class=\"language-html\">    &lt;template v-slot:title&gt;\n        &lt;h3 class=&quot;text-xl text-gray-150 font-bold uppercase px-0 md:text-2xl&quot;&gt;\n            This is a custom title\n        &lt;/h3&gt;\n    &lt;/template&gt;\n</code></pre>\n<p><code>link</code>: This slot can be used to render a custom markup for the link. Example:</p>\n<pre><code class=\"language-html\">    &lt;template v-slot:link&gt;\n        &lt;p class=&quot;flex items-center tracking-wider text-green-100 text-md uppercase px-5 md:px-0&quot;&gt;\n            &lt;a href=&quot;#&quot; title=&quot;See All&quot;&gt;\n                See All\n                &lt;span aria-hidden=&quot;true&quot; class=&quot;a-arrow -sm -right -filled  ml-3&quot;&gt;\n                    &lt;span class=&quot;a-arrow__icon border-green-100&quot;&gt;&lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/a&gt;\n        &lt;/p&gt;\n    &lt;/template&gt;\n</code></pre>\n<h2>Props</h2>\n<p><code>isShelf</code> (Type: Boolean / Default: false): This prop indicates if the carousel will be placed inside or outside the Shelf component. The CSS will be affected by this prop. If the carousel is inside the shelf, the carousel width will have a max-width.</p>\n<p><code>products</code> (Type: Array / Default: []): This prop receives the product data only if there's no product data inside the localization object (data-driven). This is the expected object for product prop:</p>\n<pre><code class=\"language-json\">[\n    {\n        &quot;Title&quot;: &quot;MelaSoft Fabric Softener 1&quot;,\n        &quot;ItemId&quot;: &quot;8c280cd739bdc1d41de974e17654f349&quot;,\n        &quot;Image&quot;: {\n            &quot;Url&quot;: &quot;http://placehold.it/200x200&quot;,\n            &quot;Alt&quot;: &quot;&quot;\n        },\n        &quot;PriceRange&quot;: {\n            &quot;MinRegularPrice&quot;: &quot;$216.00&quot;,\n            &quot;RawMinRegularPrice&quot;: 216,\n            &quot;MaxRegularPrice&quot;: &quot;&quot;,\n            &quot;RawMaxRegularPrice&quot;: null,\n            &quot;ShowRangeForRegularPrice&quot;: false,\n            &quot;MinPreferredPrice&quot;: &quot;$100.00&quot;,\n            &quot;RawMinPreferredPrice&quot;: 100,\n            &quot;MaxPreferredPrice&quot;: &quot;$72.00&quot;,\n            &quot;RawMaxPreferredPrice&quot;: 72,\n            &quot;ShowRangeForPreferredPrice&quot;: false,\n            &quot;MinPoints&quot;: &quot;0&quot;,\n            &quot;RawMinPoints&quot;: 0,\n            &quot;MaxPoints&quot;: &quot;0&quot;,\n            &quot;RawMaxPoints&quot;: 0,\n            &quot;ShowRangeForPoints&quot;: false,\n            &quot;PreferredMemberSavings&quot;: &quot;$4.00&quot;,\n            &quot;PackSavings&quot;: &quot;$2.00&quot;,\n            &quot;HasPackSavings&quot;: true,\n            &quot;HasMultiplePacks&quot;: false\n        },\n        &quot;ShowPreferredSavings&quot;: true,\n        &quot;Sku&quot;: null,\n        &quot;FamilyID&quot;: &quot;328&quot;,\n        &quot;PdpLink&quot;: &quot;/productstore/sales-aids--materials/melaleuca-a-legacy-of-wellness&quot;\n    }\n]\n</code></pre>\n<p><code>settings</code> (Type: Object / Default: {}): This prop receives the carousel settings only if there's no product data inside the localization object (data-driven). This is an example of the expected object:</p>\n<pre><code class=\"language-json\">{\n    &quot;arrows&quot;: true,\n    &quot;dots&quot;: true,\n    &quot;infinite&quot;: false,\n    &quot;speed&quot;: 500,\n    &quot;slidesToShow&quot;: 2,\n    &quot;slidesToScroll&quot;: 2,\n    &quot;variableWidth&quot;: true,\n    &quot;responsive&quot;: [\n        {\n            &quot;breakpoint&quot;: 768,\n            &quot;settings&quot;: {\n                &quot;infinite&quot;: false,\n                &quot;slidesToShow&quot;: 1,\n                &quot;slidesToScroll&quot;: 1,\n                &quot;variableWidth&quot;: true\n            }\n        }\n    ]\n}\n</code></pre>\n<p>This is the default object. It will be used if the prop is empty:</p>\n<pre><code class=\"language-javascript\">{\n    arrows: false,\n    dots: false,\n    infinite: false,\n    speed: 500,\n    slidesToShow: 7,\n    slidesToScroll: 7,\n    variableWidth: true,\n    responsive: [\n        {\n            breakpoint: 1150,\n            settings: {\n                infinite: false,\n                slidesToShow: 6,\n                slidesToScroll: 6,\n                variableWidth: true\n            }\n        },\n        {\n            breakpoint: 992,\n            settings: {\n                infinite: false,\n                slidesToShow: 5,\n                slidesToScroll: 5,\n                variableWidth: true\n            }\n        },\n        {\n            breakpoint: 865,\n            settings: {\n                infinite: false,\n                slidesToShow: 4,\n                slidesToScroll: 4,\n                variableWidth: true\n            }\n        },\n        {\n            breakpoint: 625,\n            settings: {\n                infinite: false,\n                slidesToShow: 3,\n                slidesToScroll: 3,\n                variableWidth: true\n            }\n        },\n        {\n            breakpoint: 475,\n            settings: {\n                infinite: false,\n                slidesToShow: 2,\n                slidesToScroll: 2,\n                variableWidth: true\n            }\n        },\n        {\n            breakpoint: 320,\n            settings: {\n                infinite: false,\n                slidesToShow: 1,\n                slidesToScroll: 1,\n                variableWidth: true\n            }\n        }\n    ]\n}\n</code></pre>\n<p>To see more information about all the possible settings for the carousel, see this link: <a href=\"https://github.com/gs-shop/vue-slick-carousel\">VueSlickCarousel</a>.</p>\n",

      "patternDesc": "<h2>General</h2>\n<p>Vue Product Carousel component. This component can be used in any product carousel (shelf, page etc).</p>\n<h2>Subcomponents</h2>\n<p><code>&lt;VueSlickCarousel&gt;</code>: This component uses &lt;VueSlickCarousel&gt; plugin to build the carousel. More information here: <a href=\"https://github.com/gs-shop/vue-slick-carousel\">VueSlickCarousel</a>.\n<code>&lt;m-product-card&gt;</code>: This component uses &lt;m-product-card&gt; as a subcomponent to render the product information.</p>\n<h2>Data exchange</h2>\n<h3>Labels and UserFlags</h3>\n<p>This component uses the data-driven standard to receive the labels. This is the expected object:</p>\n<pre><code class=\"language-json\">{\n    &quot;Localization&quot;: {\n        &quot;Labels&quot;: {\n            &quot;ProductCarousel&quot;: {\n                &quot;CardCta&quot;: &quot;Select&quot;,\n                &quot;CardCtaArialLabel&quot;: &quot;Add this product to card&quot;,\n                &quot;Item&quot;: &quot;Item&quot;,\n                &quot;Next&quot;: &quot;Next&quot;,\n                &quot;NextSlide&quot;: &quot;Next slide of products&quot;,\n                &quot;Of&quot;: &quot;Of&quot;,\n                &quot;Previous&quot;: &quot;Previous&quot;,\n                &quot;PreviousSlide&quot;: &quot;Previous slide of products&quot;,\n                &quot;Point&quot;: &quot;Point&quot;,\n                &quot;Points&quot;: &quot;Points&quot;,\n                &quot;RangeSR&quot;: &quot;to&quot;,\n                &quot;SeeAllLink&quot;: &quot;//productstore-qaus.melaleuca.com/&quot;,\n                &quot;SeeAllText&quot;: &quot;See All&quot;,\n                &quot;Slide&quot;: &quot;Slide&quot;,\n                &quot;FallbackTitle&quot;: &quot;Try our best sellers&quot;,\n                &quot;FallbackCarouselName&quot;: &quot;Products carousel for try our best sellers&quot;,\n                &quot;ToolTipText&quot;: &quot;&lt;p class=\\&quot;font-bold leading-base pr-15 text-gray-150\\&quot; style=\\&quot;width:135px;\\&quot;&gt;Become a Preferred Member and Save 30–50%&lt;/p&gt;&lt;a class=\\&quot;block pt-20 text-green text-sm\\&quot;&gt;Get Started&lt;/a&gt;&quot;\n            }\n        },\n        &quot;Data&quot;: {\n            &quot;DatasourceId&quot;: null,\n            &quot;NumberOfProducts&quot;: 0,\n            &quot;ShowPoints&quot;: true,\n            &quot;ShowPrices&quot;: true,\n            &quot;UserFlags&quot;: {\n                &quot;IsGuestShoppingEnabled&quot;: false,\n                &quot;IsGuest&quot;: false,\n                &quot;IsAuthenticated&quot;: true,\n                &quot;ViewLists&quot;: true,\n                &quot;ViewMemberPricing&quot;: true,\n                &quot;ViewPoints&quot;: true\n            }\n        }\n    }\n}\n</code></pre>\n<h3>Product data</h3>\n<p>This component uses Product Carousel API to get product data, but also uses the props o receive the data.</p>\n<h3>Carousel Settings</h3>\n<p>This component uses props to receive the carousel settings. If this prop is empty, the component will use a default/hardcoded settings.</p>\n<h3>Slots</h3>\n<p>This component is prepared to receive some information using slots:</p>\n<p><code>title</code>: This slot can be used to render a custom markup for the title. Example:</p>\n<pre><code class=\"language-html\">    &lt;template v-slot:title&gt;\n        &lt;h3 class=&quot;text-xl text-gray-150 font-bold uppercase px-0 md:text-2xl&quot;&gt;\n            This is a custom title\n        &lt;/h3&gt;\n    &lt;/template&gt;\n</code></pre>\n<p><code>link</code>: This slot can be used to render a custom markup for the link. Example:</p>\n<pre><code class=\"language-html\">    &lt;template v-slot:link&gt;\n        &lt;p class=&quot;flex items-center tracking-wider text-green-100 text-md uppercase px-5 md:px-0&quot;&gt;\n            &lt;a href=&quot;#&quot; title=&quot;See All&quot;&gt;\n                See All\n                &lt;span aria-hidden=&quot;true&quot; class=&quot;a-arrow -sm -right -filled  ml-3&quot;&gt;\n                    &lt;span class=&quot;a-arrow__icon border-green-100&quot;&gt;&lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/a&gt;\n        &lt;/p&gt;\n    &lt;/template&gt;\n</code></pre>\n<h2>Props</h2>\n<p><code>isShelf</code> (Type: Boolean / Default: false): This prop indicates if the carousel will be placed inside or outside the Shelf component. The CSS will be affected by this prop. If the carousel is inside the shelf, the carousel width will have a max-width.</p>\n<p><code>products</code> (Type: Array / Default: []): This prop receives the product data only if there's no product data inside the localization object (data-driven). This is the expected object for product prop:</p>\n<pre><code class=\"language-json\">[\n    {\n        &quot;Title&quot;: &quot;MelaSoft Fabric Softener 1&quot;,\n        &quot;ItemId&quot;: &quot;8c280cd739bdc1d41de974e17654f349&quot;,\n        &quot;Image&quot;: {\n            &quot;Url&quot;: &quot;http://placehold.it/200x200&quot;,\n            &quot;Alt&quot;: &quot;&quot;\n        },\n        &quot;PriceRange&quot;: {\n            &quot;MinRegularPrice&quot;: &quot;$216.00&quot;,\n            &quot;RawMinRegularPrice&quot;: 216,\n            &quot;MaxRegularPrice&quot;: &quot;&quot;,\n            &quot;RawMaxRegularPrice&quot;: null,\n            &quot;ShowRangeForRegularPrice&quot;: false,\n            &quot;MinPreferredPrice&quot;: &quot;$100.00&quot;,\n            &quot;RawMinPreferredPrice&quot;: 100,\n            &quot;MaxPreferredPrice&quot;: &quot;$72.00&quot;,\n            &quot;RawMaxPreferredPrice&quot;: 72,\n            &quot;ShowRangeForPreferredPrice&quot;: false,\n            &quot;MinPoints&quot;: &quot;0&quot;,\n            &quot;RawMinPoints&quot;: 0,\n            &quot;MaxPoints&quot;: &quot;0&quot;,\n            &quot;RawMaxPoints&quot;: 0,\n            &quot;ShowRangeForPoints&quot;: false,\n            &quot;PreferredMemberSavings&quot;: &quot;$4.00&quot;,\n            &quot;PackSavings&quot;: &quot;$2.00&quot;,\n            &quot;HasPackSavings&quot;: true,\n            &quot;HasMultiplePacks&quot;: false\n        },\n        &quot;ShowPreferredSavings&quot;: true,\n        &quot;Sku&quot;: null,\n        &quot;FamilyID&quot;: &quot;328&quot;,\n        &quot;PdpLink&quot;: &quot;/productstore/sales-aids--materials/melaleuca-a-legacy-of-wellness&quot;\n    }\n]\n</code></pre>\n<p><code>settings</code> (Type: Object / Default: {}): This prop receives the carousel settings only if there's no product data inside the localization object (data-driven). This is an example of the expected object:</p>\n<pre><code class=\"language-json\">{\n    &quot;arrows&quot;: true,\n    &quot;dots&quot;: true,\n    &quot;infinite&quot;: false,\n    &quot;speed&quot;: 500,\n    &quot;slidesToShow&quot;: 2,\n    &quot;slidesToScroll&quot;: 2,\n    &quot;variableWidth&quot;: true,\n    &quot;responsive&quot;: [\n        {\n            &quot;breakpoint&quot;: 768,\n            &quot;settings&quot;: {\n                &quot;infinite&quot;: false,\n                &quot;slidesToShow&quot;: 1,\n                &quot;slidesToScroll&quot;: 1,\n                &quot;variableWidth&quot;: true\n            }\n        }\n    ]\n}\n</code></pre>\n<p>This is the default object. It will be used if the prop is empty:</p>\n<pre><code class=\"language-javascript\">{\n    arrows: false,\n    dots: false,\n    infinite: false,\n    speed: 500,\n    slidesToShow: 7,\n    slidesToScroll: 7,\n    variableWidth: true,\n    responsive: [\n        {\n            breakpoint: 1150,\n            settings: {\n                infinite: false,\n                slidesToShow: 6,\n                slidesToScroll: 6,\n                variableWidth: true\n            }\n        },\n        {\n            breakpoint: 992,\n            settings: {\n                infinite: false,\n                slidesToShow: 5,\n                slidesToScroll: 5,\n                variableWidth: true\n            }\n        },\n        {\n            breakpoint: 865,\n            settings: {\n                infinite: false,\n                slidesToShow: 4,\n                slidesToScroll: 4,\n                variableWidth: true\n            }\n        },\n        {\n            breakpoint: 625,\n            settings: {\n                infinite: false,\n                slidesToShow: 3,\n                slidesToScroll: 3,\n                variableWidth: true\n            }\n        },\n        {\n            breakpoint: 475,\n            settings: {\n                infinite: false,\n                slidesToShow: 2,\n                slidesToScroll: 2,\n                variableWidth: true\n            }\n        },\n        {\n            breakpoint: 320,\n            settings: {\n                infinite: false,\n                slidesToShow: 1,\n                slidesToScroll: 1,\n                variableWidth: true\n            }\n        }\n    ]\n}\n</code></pre>\n<p>To see more information about all the possible settings for the carousel, see this link: <a href=\"https://github.com/gs-shop/vue-slick-carousel\">VueSlickCarousel</a>.</p>\n",
