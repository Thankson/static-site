<article class="m-prodCard -grid">
  <a class="m-prodCard__row -content" href="#">
    <div class="m-prodCard__header">
      <div class="m-prodCard__tag">
        <div class="uppercase font-medium text-white text-base text-sm rounded-full px-18 py-4 inline-flex items-center bg-white text-gray border">
          <em class="mx-auto not-italic font-medium uppercase text-tiny">BEST SELLER</em>
        </div>
      </div>

      <div class="m-prodCard__media">
        <img class="m-prodCard__hero" src="http://placehold.it/250x250" alt="">
      </div>

      <div class="m-prodCard__heading">
        <em class="m-prodCard__title ">EcoSense® Laundry 4-Pack</em>
      </div>
    </div>

    <div class="m-prodCard__body">
      <div class="m-prodCard__content -top">
        <div class="m-prodCard__save">
          <div class="a-iconTag" aria-hidden="true"></div>

          <span class="m-prodCard__text -saveAmount">Save $9.00</span>
          <span class="m-prodCard__text -saveInfo">vs buying individual products</span>

          <span class="m-prodCard__text -saveLearn "></span>
        </div>
      </div>

      <div class="m-prodCard__content -bottom">
        <div class="m-prodCard__pricing ">

          <span class="m-prodCard__row -price -first ">
            <span class="m-prodCard__text -price -lgBold">$24.97–$43.30</span>
            <span class="m-prodCard__text -price">Preferred</span>
          </span>

          <span class="m-prodCard__row -price -second ">
            <span class="m-prodCard__text -price">$36.00–$62.00</span>
            <span class="m-prodCard__text -price">Regular</span>
          </span>
        </div>

        <div class="m-prodCard__points ">
          <span class="sr-only">Earn </span>
          <span class="m-prodCard__text -points">11–20 Points</span>
        </div>

      </div>
    </div>
  </a>

  <div class="m-prodCard__row -actions">
    <div class="m-prodCard__button -shelfToggle">


      <o-shelf-configurator aria-label="Select your options to add to cart" sku="6266" cart="order" family-id="123" configurator="1" class="a-button justify-center w-full" script-id="data-shelf-configurator-localization">
        <span class="flex justify-center items-center text-white md:hidden" aria-hidden="true">
          <span class="font-global-sans inline-block text-3xl leading-none mr-4">+</span>
          <span class="material-icons inline-block">shopping_cart</span>
        </span>
        <span class="sr-only md:not-sr-only md:block">Select</span>
      </o-shelf-configurator>

    </div>

  </div>
</article>
