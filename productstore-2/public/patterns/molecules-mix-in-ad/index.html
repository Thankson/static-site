			{"cssEnabled":false,"patternLineageExists":false,"patternLineages":[],"lineage":[],"patternLineageRExists":false,"patternLineagesR":[],"lineageR":[],"patternLineageEExists":false,"patternDesc":"<h2>General</h2>\n<ol>\n<li>\n<p>This component consists of a single markup that can compose up to 4 variations, depending on which data is received.</p>\n</li>\n<li>\n<p>This is a Vue component located at: <code>source/js/vue/components/01-molecules/mix-in-ad</code></p>\n</li>\n<li>\n<p>This component requires a <strong>RenderingId</strong> to determine which data will be loaded.</p>\n</li>\n<li>\n<p>This component uses <strong>props</strong>(single object) to pass and receive data.</p>\n</li>\n<li>\n<p>The functionality of the video play button(vue) <strong>has not been developed yet in vue</strong>, just UI.</p>\n</li>\n<li>\n<p>The following content are RTE fields:</p>\n<ul>\n<li>Top Text(above product image)</li>\n<li>Bottom Text(below product image)</li>\n<li>Watch Video Text</li>\n</ul>\n</li>\n<li>\n<p>The author can choose between a Background Image or Color for the Ad</p>\n<ul>\n<li><strong>BackgroundImage</strong> or <strong>BackgroundColor</strong> fields</li>\n</ul>\n</li>\n<li>\n<p>If the author does not provide a <strong>Logo Image</strong>, the space at the top will be considered anyway.</p>\n</li>\n</ol>\n<h2>Variations</h2>\n<ol>\n<li>\n<p>Variations #1 and #2 have two clickable areas: <strong>The Card Link</strong> and the <strong>Add to Cart Button</strong></p>\n</li>\n<li>\n<p>Variation #3 does not have Add to Cart Button and the only clickable area is the <strong>Card Link</strong></p>\n</li>\n<li>\n<p>Variation #4 has two clickable areas: <strong>The Card Link</strong> and the <strong>Video Button</strong></p>\n<ul>\n<li>The div for the Video Button and Video Text is only rendered for this variation</li>\n<li><code>&lt;div v-if=&quot;context.RenderingId === '4'&quot; class=&quot;m-mixinAd__row -videoButton&quot;&gt;[...]&lt;/div&gt;</code></li>\n<li><code>&lt;div v-if=&quot;context.RenderingId === '4'&quot; class=&quot;m-mixinAd__row -videoText&quot; [...]&gt;[...]&lt;/div&gt;</code></li>\n</ul>\n</li>\n<li>\n<p>Variation #6 has two clickable areas: <strong>The Card Link</strong> and the <strong>Add to Cart</strong>. The <strong>Product Image</strong> is in the footer area, outside the Card Link Area.</p>\n<ul>\n<li>The div for the footer image is only rendered for this variation:</li>\n<li><code>&lt;div v-if=&quot;context.RenderingId === '6'&quot; class=&quot;m-mixinAd__img -footer&quot;&gt;[...]&lt;/div&gt;</code></li>\n</ul>\n</li>\n<li>\n<p>Variation #7 and #8 have two clickable areas: <strong>The Card Link</strong> and the <strong>Add to Cart</strong>. The <strong>Product Image</strong> is in the header area.</p>\n<ul>\n<li>The div for the header image is only rendered for these variations:</li>\n<li><code>&lt;div v-if=&quot;context.RenderingId === '7' || context.RenderingId === '8'&quot; class=&quot;m-mixinAd__img -header&quot;&gt;[...]&lt;/div&gt;</code></li>\n</ul>\n</li>\n<li>\n<p>Variation #8 does not have a logo and also have a <strong>Footer Text</strong>.</p>\n</li>\n</ol>\n<h2>ADA</h2>\n<ol>\n<li>\n<p>The component has <strong>Aria label</strong> for the following items:</p>\n<ul>\n<li>Add to Cart Button</li>\n<li>Card Link</li>\n</ul>\n</li>\n<li>\n<p>The Logo and Product Images have alt text fields in json file</p>\n</li>\n</ol>\n","patternBreadcrumb":{"patternGroup":"molecules","patternSubgroup":"mix-in-ad"},"patternExtension":"hbs","patternName":"Mix In Ad","patternPartial":"molecules-mix-in-ad","patternState":"","patternEngineName":"handlebars","extraOutput":{}}
