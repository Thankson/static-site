    <script type="application/json" id="IngredientPhilosophy">
      {
        "Data": {
          "Title": "Our <span class=\"uppercase font-bold\">Smarter Choice</span> Philosophy",
          "BgColor": "#002E1C",
          "Columns": [{
            "Heading": "Safe",
            "SubHeading": "We only use the safest, most dependable ingredients available.",
            "Image": {
              "Url": "https://placehold.it/770x390",
              "Alt": "Image description"
            },
            "RTE": "<div class=\"m-rte\"><div class=\"mx-auto w-full\" style=\"max-width:870px\"><h3 class=\"block leading-tight text-gray-150 text-xl w-full\">Naturally safe ingredients are our priority. The best naturally <span class=\"lg:block lg:mb-0\">derived and plant-derived ingredients may cost a little more, but </span><span class=\"lg:block lg:mb-0\">we take pride in investing in what matters most.</span></h3><ul class=\"mt-40 lg:flex lg:justify-between\"><li class=\"list-none my-20 pt-20 lg:even:px-30 lg:w-1_3 lg:my-0\"> <span role=\"text\" class=\"block border-t border-gray-150 pt-20 w-full\"><p class=\"leading-tight text-gray-150 text-sm w-full\"><span class=\"font-bold uppercase\">Fragrance</span> A properly selected, safe fragrance brings a sense of clean to bathrooms and laundry and a sense of enjoyment to lotions and shampoos. We only select high-quality essential and fragrance oils that are guaranteed to meet our Safe Scent® standard, and meet the International Fragrance Association (IFRA) standards that protect against levels of irritation and sensitivity and must be free from contaminants. They undergo stringent testing for purity, quality, and all leave-on products undergo third-party sensitivity testing with a certified dermatologist. If it’s not safe, we won’t use it.</p> </span></li><li class=\"list-none my-20 pt-20 lg:even:px-30 lg:w-1_3 lg:my-0\"> <span role=\"text\" class=\"block border-t border-gray-150 pt-20 w-full\"><p class=\"leading-tight text-gray-150 text-sm w-full\"><span class=\"font-bold uppercase\">Colorants</span> Color makes life better, enhances emotional mood, and makes our world more appealing. Color and safety go hand-in-hand. We use only safe colorants that are non-toxic and won’t accumulate in the environment. We select colors with the highest safety profiles for our home and personal care products. All are batch certified, have been thoroughly tested to be free of impurities and contaminants, and are Food, Drug & Cosmetic (FD&C) certified by the US Food & Drug Administration (FDA).</p> </span></li><li class=\"list-none my-20 pt-20 lg:w-1_3 lg:my-0\"> <span role=\"text\" class=\"block border-t border-gray-150 pt-20 w-full\"><p class=\"leading-tight text-gray-150 text-sm w-full\"><span class=\"font-bold uppercase\">Preservatives</span> Without proper preservatives, many natural products degrade quickly and can easily become home to mold and bacteria. The solution to keeping natural products fresh and safe is to add proven, safe, and effective preservatives. As of today, there are no effective plant-derived preservatives. If one were available, we would use it. In the meantime, we select the safest, most effective preservatives that allow us to use the tiniest amounts possible. We never use cheaper preservatives known to cause health issues such as formaldehyde or parabens.</p> </span></li></ul></div></div>",
            "ExpandAction": "More",
            "CollapseAction": "Less",
            "ButtonAriaLabel": "Learn {0} about {1}"
          }, {
            "Heading": "Effective Effective Effective Effective",
            "SubHeading": "We all want, expect, and need products that work as they should.",
            "Image": {
              "Url": "https://placehold.it/770x390",
              "Alt": "Image description"
            },
            "RTE": "<div class=\"m-rte\"><div class=\"mx-auto w-full\" style=\"max-width:970px\"><h3 class=\"block leading-tight text-gray-150 text-xl w-full\" style=\"max-width:570px\">Proof matters. We rigorously test our formulas to prove they work and work better than other brands. Here’s one example:</h3><div class=\"mt-40 lg:flex\"><div class=\"border-t border-gray-150 pt-20 md:pr-30\"><p class=\"leading-tight text-gray-150 text-sm w-full\"><span class=\"font-bold uppercase\">Laundry Detergent</span> These fabric swatches are stained with starch-based food soils that are nearly impossible to remove. Each fabric swatch is washed one complete washing machine cycle in cold water. The results are dramatic when compared to other “green” detergents. Only MelaPower 9x® is able to remove the starch stains</p></div> <img src=\"//cdnsc1.melaleuca.com/na/images/product-store/melapower-stains-desktop.png\" alt=\"Melapower Stains\" class=\"hidden ml-30 md:block md:mt-20 lg:mt-0\"> <img src=\"//cdnsc1.melaleuca.com/na/images/product-store/melapower-stains-mobile.png\" alt=\"Melapower Stains\" class=\"mt-40 md:hidden\"></div></div></div>",
            "ExpandAction": "More",
            "CollapseAction": "Less",
            "ButtonAriaLabel": "Learn {0} about {1}"
          }, {
            "Heading": "Eco-Friendly Eco-Friendly",
            "SubHeading": "Making a difference with concentrated products that reduce waste. Making a difference with concentrated products that reduce waste. Making a difference with concentrated products that reduce waste.",
            "Image": {
              "Url": "https://placehold.it/770x390",
              "Alt": "Image description"
            },
            "RTE": "<div class=\"m-rte\"><div class=\"mx-auto w-full\" style=\"max-width:930px\"><h3 class=\"block leading-tight text-gray-150 text-xl w-full\">When we say “eco-friendly” we are referring to the difference we <span class=\"lg:block lg:mb-0\">make reducing waste with highly concentrated products. It’s a</span><span class=\"lg:block lg:mb-0\"> way we can make an impact that really matters.</span></h3><div class=\"mt-40 lg:flex\"><div class=\"border-t border-gray-150 pt-20 md:pr-30 lg:w-250\"><p class=\"leading-tight text-gray-150 text-sm w-full\"><span class=\"font-bold uppercase\">a concentrated effort</span> By concentrating products, we reduce the size of everything in the supply chain. Less storage, fewer storage tanks, smaller warehouses, a smaller footprint, fewer trucks, fewer trips, less cardboard used in shipping boxes, less fuel, dramatically less greenhouse emissions, and, most of all, less virgin plastic is used in the first place.</p></div><div class=\"flex flex-col items-center justify-center mt-30 w-full lg:justify-between lg:ml-50 lg:mt-0 lg:w-auto\"><h3 class=\"leading-tight mb-40 text-gray-150 text-center text-xl md:mb-0\" role=\"text\">By switching to concentrated products, <span class=\"font-bold uppercase md:block\">MELALEUCA CUSTOMERS HAVE SAVED</span></h3><ul class=\"flex flex-col items-center w-full md:flex md:flex-row md:justify-between md:mt-15\"><li class=\"flex flex-col items-center my-15 md:my-0 lg:mr-50 last:mr-0\"> <img src=\"//cdnsc1.melaleuca.com/na/images/product-store/eco-friendly-bottle.png\" alt=\"\"><p class=\"font-medium leading-tight text-center text-gray-150 text-sm\">260 million pounds <span class=\"block\">of plastic</span></p></li><li class=\"flex flex-col items-center my-15 md:my-0 lg:mr-50 last:mr-0\"> <img src=\"//cdnsc1.melaleuca.com/na/images/product-store/eco-friendly-gas-pump.png\" alt=\"\"><p class=\"font-medium leading-tight text-center text-gray-150 text-sm\">45 million gallons <span class=\"block\">of fuel</span></p></li><li class=\"flex flex-col items-center my-15 md:my-0 lg:mr-50 last:mr-0\"> <img src=\"//cdnsc1.melaleuca.com/na/images/product-store/eco-friendly-truck.png\" alt=\"\"><p class=\"font-medium leading-tight text-center text-gray-150 text-sm\">1. 4 billion pounds <span class=\"block\">of harmful gas emissions</span></p></li></ul></div></div></div></div>",
            "ExpandAction": "More",
            "CollapseAction": "Less",
            "ButtonAriaLabel": "Learn {0} about {1}"
          }, {
            "Heading": "Affordable",
            "SubHeading": "We not only save plastic and the environment, we save you money.",
            "Image": {
              "Url": "https://placehold.it/770x390",
              "Alt": "Image description"
            },
            "RTE": "<div class=\"m-rte\"><div class=\"mx-auto w-full\" style=\"max-width:930px\"><h3 class=\"block leading-tight text-gray-150 text-xl w-full\">Concentrated is a better value.</h3><div class=\"mt-40 lg:flex\"><div class=\"border-t border-gray-150 pt-20 w-full lg:max-w-260\"><p class=\"leading-tight text-gray-120 text-sm w-full\">We take out unnecessary fillers (mostly water), leaving nothing that doesn’t absolutely need to be in our products. The end result? You save time, money, extra plastic, and the energy needed to ship all that water.</p></div><div class=\"flex flex-col items-center justify-center mt-30 w-full md:justify-between md:ml-50 lg:mt-0\" style=\"max-width: 595px;\"><table class=\"max-w-full mb-20 text-center w-full md:mx-auto md:w-auto\" aria-describedby=\"melapowerComparisonChartSummary\" cellspacing=\"0\" style=\"border-spacing: 0;border-collapse: separate;\"><caption class=\"sr-only\">MelaPower Comparison Chart</caption><thead><tr><th class=\"sr-only\"></th><th class=\"font-medium pb-15 text-sm\" scope=\"col\" style=\"color:#002883;\"> <img class=\"mx-auto\" src=\"//cdnsc1.melaleuca.com/na/images/product-detail-pages/melapower/melapower-bottle--2x.png\" alt=\"Melapower\" /> Melapower</th><th class=\"font-medium pb-15 text-sm\" scope=\"col\" style=\"color:#002883;\"> <img class=\"mx-auto\" src=\"//cdnsc1.melaleuca.com/na/images/product-detail-pages/melapower/tide-bottle--2x.png\" alt=\"Tide&reg;\" /> Tide&reg;</th><th class=\"font-medium pb-15 text-sm\" scope=\"col\" style=\"color:#002883;\"> <img class=\"mx-auto\" src=\"//cdnsc1.melaleuca.com/na/images/product-detail-pages/melapower/method-bottle--2x.png\" alt=\"Method&reg;\" /> Method&reg;</th><th class=\"font-medium pb-15 text-sm\" scope=\"col\" style=\"color:#002883;\"> <img class=\"mx-auto\" src=\"//cdnsc1.melaleuca.com/na/images/product-detail-pages/melapower/grove-bottle--2x.png\" alt=\"Grove&reg;\" /> Grove&reg;</th></tr></thead><tbody><tr class=\"mb-0\"><th class=\"sr-only\" scope=\"row\">Price Per Load</th><td class=\"italic leading-base mb-0 p-0 relative text-sm\" style=\"color:#777777;\"><div class=\"border border-b-0 mb-0 mx-5 px-10 py-15 sm:mx-15\" style=\"border-color:#707070;\"> <span class=\"font-bold italic text-2xl\" style=\"color:#0DBBF0;\">18&cent;</span><br />per load</div></td><td class=\"italic leading-base mb-0 p-0 relative text-sm\" style=\"color:#777777;\"><div class=\"border border-b-0 mb-0 mx-5 px-10 py-15 sm:mx-15\" style=\"border-color:#707070;\"> <span class=\"font-bold italic text-2xl\" style=\"color:#0DBBF0;\">43&cent;</span><br />per load</div></td><td class=\"italic leading-base mb-0 p-0 relative text-sm\" style=\"color:#777777;\"><div class=\"border border-b-0 mb-0 mx-5 px-10 py-15 sm:mx-15\" style=\"border-color:#707070;\"> <span class=\"font-bold italic text-2xl\" style=\"color:#0DBBF0;\">36&cent;</span><br />per load</div></td><td class=\"italic leading-base mb-0 p-0 relative text-sm\" style=\"color:#777777;\"><div class=\"border border-b-0 mb-0 mx-5 px-10 py-15 sm:mx-15\" style=\"border-color:#707070;\"> <span class=\"font-bold italic text-2xl\" style=\"color:#0DBBF0;\">30&cent;</span><br />per load</div></td></tr><tr class=\"mb-0\"><th class=\"sr-only\" scope=\"row\">Total Loads</th><td class=\"italic leading-base mb-0 p-0 relative text-sm\" style=\"color:#777777;\"><div class=\"border border-b-0 mb-0 mx-5 px-10 py-15 sm:mx-15\" style=\"border-color:#707070;\">96 loads</div></td><td class=\"italic leading-base mb-0 p-0 relative text-sm\" style=\"color:#777777;\"><div class=\"border border-b-0 mb-0 mx-5 px-10 py-15 sm:mx-15\" style=\"border-color:#707070;\">16 loads</div></td><td class=\"italic leading-base mb-0 p-0 relative text-sm\" style=\"color:#777777;\"><div class=\"border border-b-0 mb-0 mx-5 px-10 py-15 sm:mx-15\" style=\"border-color:#707070;\">50 loads</div></td><td class=\"italic leading-base mb-0 p-0 relative text-sm\" style=\"color:#777777;\"><div class=\"border border-b-0 mb-0 mx-5 px-10 py       "patternDesc": "<h2>General</h2>\n<p>Ingredient Philosophy component. This is a Vue component width 1 - 4 columns.</p>\n<h2>Data</h2>\n<p>This component uses the data-driven standard to receive the data. This is the expected data object:</p>\n<pre><code class=\"language-json\">{\n    &quot;Data&quot;: {\n        &quot;Title&quot;: &quot;Our &lt;span class=\\&quot;uppercase font-bold\\&quot;&gt;Smarter Choice&lt;/span&gt; Philosophy&quot;,\n        &quot;BgColor&quot;: &quot;#002E1C&quot;,\n        &quot;Columns&quot;: [\n            {\n                &quot;Heading&quot;: &quot;Safe&quot;,\n                &quot;SubHeading&quot;: &quot;We only use the safest, most dependable ingredients available.&quot;,\n                &quot;Image&quot;: {\n                    &quot;Url&quot;: &quot;https://placehold.it/770x390&quot;,\n                    &quot;Alt&quot;: &quot;Image description&quot;\n                },\n                &quot;RTE&quot;: &quot;&lt;div class=\\&quot;m-rte\\&quot;&gt;&lt;div class=\\&quot;mx-auto w-full\\&quot; style=\\&quot;max-width:870px\\&quot;&gt;&lt;h3 class=\\&quot;block leading-tight text-gray-150 text-xl w-full\\&quot;&gt;Naturally safe ingredients are our priority. The best naturally &lt;span class=\\&quot;lg:block lg:mb-0\\&quot;&gt;derived and plant-derived ingredients may cost a little more, but &lt;/span&gt;&lt;span class=\\&quot;lg:block lg:mb-0\\&quot;&gt;we take pride in investing in what matters most.&lt;/span&gt;&lt;/h3&gt;&lt;ul class=\\&quot;mt-40 lg:flex lg:justify-between\\&quot;&gt;&lt;li class=\\&quot;list-none my-20 pt-20 lg:even:px-30 lg:w-1_3 lg:my-0\\&quot;&gt; &lt;span role=\\&quot;text\\&quot; class=\\&quot;block border-t border-gray-150 pt-20 w-full\\&quot;&gt;&lt;p class=\\&quot;leading-tight text-gray-150 text-sm w-full\\&quot;&gt;&lt;span class=\\&quot;font-bold uppercase\\&quot;&gt;Fragrance&lt;/span&gt; A properly selected, safe fragrance brings a sense of clean to bathrooms and laundry and a sense of enjoyment to lotions and shampoos. We only select high-quality essential and fragrance oils that are guaranteed to meet our Safe Scent® standard, and meet the International Fragrance Association (IFRA) standards that protect against levels of irritation and sensitivity and must be free from contaminants. They undergo stringent testing for purity, quality, and all leave-on products undergo third-party sensitivity testing with a certified dermatologist. If it’s not safe, we won’t use it.&lt;/p&gt; &lt;/span&gt;&lt;/li&gt;&lt;li class=\\&quot;list-none my-20 pt-20 lg:even:px-30 lg:w-1_3 lg:my-0\\&quot;&gt; &lt;span role=\\&quot;text\\&quot; class=\\&quot;block border-t border-gray-150 pt-20 w-full\\&quot;&gt;&lt;p class=\\&quot;leading-tight text-gray-150 text-sm w-full\\&quot;&gt;&lt;span class=\\&quot;font-bold uppercase\\&quot;&gt;Colorants&lt;/span&gt; Color makes life better, enhances emotional mood, and makes our world more appealing. Color and safety go hand-in-hand. We use only safe colorants that are non-toxic and won’t accumulate in the environment. We select colors with the highest safety profiles for our home and personal care products. All are batch certified, have been thoroughly tested to be free of impurities and contaminants, and are Food, Drug &amp; Cosmetic (FD&amp;C) certified by the US Food &amp; Drug Administration (FDA).&lt;/p&gt; &lt;/span&gt;&lt;/li&gt;&lt;li class=\\&quot;list-none my-20 pt-20 lg:w-1_3 lg:my-0\\&quot;&gt; &lt;span role=\\&quot;text\\&quot; class=\\&quot;block border-t border-gray-150 pt-20 w-full\\&quot;&gt;&lt;p class=\\&quot;leading-tight text-gray-150 text-sm w-full\\&quot;&gt;&lt;span class=\\&quot;font-bold uppercase\\&quot;&gt;Preservatives&lt;/span&gt; Without proper preservatives, many natural products degrade quickly and can easily become home to mold and bacteria. The solution to keeping natural products fresh and safe is to add proven, safe, and effective preservatives. As of today, there are no effective plant-derived preservatives. If one were available, we would use it. In the meantime, we select the safest, most effective preservatives that allow us to use the tiniest amounts possible. We never use cheaper preservatives known to cause health issues such as formaldehyde or parabens.&lt;/p&gt; &lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&quot;,\n                &quot;ExpandAction&quot;: &quot;More&quot;,\n                &quot;CollapseAction&quot;: &quot;Less&quot;\n            },\n            {\n                &quot;Heading&quot;: &quot;Effective Effective Effective Effective&quot;,\n                &quot;SubHeading&quot;: &quot;We all want, expect, and need products that work as they should.&quot;,\n                &quot;Image&quot;: {\n                    &quot;Url&quot;: &quot;https://placehold.it/770x390&quot;,\n                    &quot;Alt&quot;: &quot;Image description&quot;\n                },\n                &quot;RTE&quot;: &quot;&lt;div class=\\&quot;m-rte\\&quot;&gt;&lt;div class=\\&quot;mx-auto w-full\\&quot; style=\\&quot;max-width:970px\\&quot;&gt;&lt;h3 class=\\&quot;block leading-tight text-gray-150 text-xl w-full\\&quot; style=\\&quot;max-width:570px\\&quot;&gt;Proof matters. We rigorously test our formulas to prove they work and work better than other brands. Here’s one example:&lt;/h3&gt;&lt;div class=\\&quot;mt-40 lg:flex\\&quot;&gt;&lt;div class=\\&quot;border-t border-gray-150 pt-20 md:pr-30\\&quot;&gt;&lt;p class=\\&quot;leading-tight text-gray-150 text-sm w-full\\&quot;&gt;&lt;span class=\\&quot;font-bold uppercase\\&quot;&gt;Laundry Detergent&lt;/span&gt; These fabric swatches are stained with starch-based food soils that are nearly impossible to remove. Each fabric swatch is washed one complete washing machine cycle in cold water. The results are dramatic when compared to other “green” detergents. Only MelaPower 9x® is able to remove the starch stains&lt;/p&gt;&lt;/div&gt; &lt;img src=\\&quot;//cdnsc1.melaleuca.com/na/images/product-store/melapower-stains-desktop.png\\&quot; alt=\\&quot;Melapower Stains\\&quot; class=\\&quot;hidden ml-30 md:block md:mt-20 lg:mt-0\\&quot;&gt; &lt;img src=\\&quot;//cdnsc1.melaleuca.com/na/images/product-store/melapower-stains-mobile.png\\&quot; alt=\\&quot;Melapower Stains\\&quot; class=\\&quot;mt-40 md:hidden\\&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&quot;,\n                &quot;ExpandAction&quot;: &quot;More&quot;,\n                &quot;CollapseAction&quot;: &quot;Less&quot;\n            },\n            {\n                &quot;Heading&quot;: &quot;Eco-Friendly Eco-Friendly&quot;,\n                &quot;SubHeading&quot;: &quot;Making a difference with concentrated products that reduce waste. Making a difference with concentrated products that reduce waste. Making a difference with concentrated products that reduce waste.&quot;,\n                &quot;Image&quot;: {\n                    &quot;Url&quot;: &quot;https://placehold.it/770x390&quot;,\n                    &quot;Alt&quot;: &quot;Image description&quot;\n                },\n                &quot;RTE&quot;: &quot;&lt;div class=\\&quot;m-rte\\&quot;&gt;&lt;div class=\\&quot;mx-auto w-full\\&quot; style=\\&quot;max-width:930px\\&quot;&gt;&lt;h3 class=\\&quot;block leading-tight text-gray-150 text-xl w-full\\&quot;&gt;When we say “eco-friendly” we are referring to the difference we &lt;span class=\\&quot;lg:block lg:mb-0\\&quot;&gt;make reducing waste with highly concentrated products. It’s a&lt;/span&gt;&lt;span class=\\&quot;lg:block lg:mb-0\\&quot;&gt; way we can make an impact that really matters.&lt;/span&gt;&lt;/h3&gt;&lt;div class=\\&quot;mt-40 lg:flex\\&quot;&gt;&lt;div class=\\&quot;border-t border-gray-150 pt-20 md:pr-30 lg:w-250\\&quot;&gt;&lt;p class=\\&quot;leading-tight text-gray-150 text-sm w-full\\&quot;&gt;&lt;span class=\\&quot;font-bold uppercase\\&quot;&gt;a concentrated effort&lt;/span&gt; By concentrating products, we reduce the size of everything in the supply chain. Less storage       "patternDesc": "<h2>General</h2>\n<p>Ingredient Philosophy component. This is a Vue component width 1 - 4 columns.</p>\n<h2>Data</h2>\n<p>This component uses the data-driven standard to receive the data. This is the expected data object:</p>\n<pre><code class=\"language-json\">{\n    &quot;Data&quot;: {\n        &quot;Title&quot;: &quot;Our &lt;span class=\\&quot;uppercase font-bold\\&quot;&gt;Smarter Choice&lt;/span&gt; Philosophy&quot;,\n        &quot;BgColor&quot;: &quot;#002E1C&quot;,\n        &quot;Columns&quot;: [\n            {\n                &quot;Heading&quot;: &quot;Safe&quot;,\n                &quot;SubHeading&quot;: &quot;We only use the safest, most dependable ingredients available.&quot;,\n                &quot;Image&quot;: {\n                    &quot;Url&quot;: &quot;https://placehold.it/770x390&quot;,\n                    &quot;Alt&quot;: &quot;Image description&quot;\n                },\n                &quot;RTE&quot;: &quot;&lt;div class=\\&quot;m-rte\\&quot;&gt;&lt;div class=\\&quot;mx-auto w-full\\&quot; style=\\&quot;max-width:870px\\&quot;&gt;&lt;h3 class=\\&quot;block leading-tight text-gray-150 text-xl w-full\\&quot;&gt;Naturally safe ingredients are our priority. The best naturally &lt;span class=\\&quot;lg:block lg:mb-0\\&quot;&gt;derived and plant-derived ingredients may cost a little more, but &lt;/span&gt;&lt;span class=\\&quot;lg:block lg:mb-0\\&quot;&gt;we take pride in investing in what matters most.&lt;/span&gt;&lt;/h3&gt;&lt;ul class=\\&quot;mt-40 lg:flex lg:justify-between\\&quot;&gt;&lt;li class=\\&quot;list-none my-20 pt-20 lg:even:px-30 lg:w-1_3 lg:my-0\\&quot;&gt; &lt;span role=\\&quot;text\\&quot; class=\\&quot;block border-t border-gray-150 pt-20 w-full\\&quot;&gt;&lt;p class=\\&quot;leading-tight text-gray-150 text-sm w-full\\&quot;&gt;&lt;span class=\\&quot;font-bold uppercase\\&quot;&gt;Fragrance&lt;/span&gt; A properly selected, safe fragrance brings a sense of clean to bathrooms and laundry and a sense of enjoyment to lotions and shampoos. We only select high-quality essential and fragrance oils that are guaranteed to meet our Safe Scent® standard, and meet the International Fragrance Association (IFRA) standards that protect against levels of irritation and sensitivity and must be free from contaminants. They undergo stringent testing for purity, quality, and all leave-on products undergo third-party sensitivity testing with a certified dermatologist. If it’s not safe, we won’t use it.&lt;/p&gt; &lt;/span&gt;&lt;/li&gt;&lt;li class=\\&quot;list-none my-20 pt-20 lg:even:px-30 lg:w-1_3 lg:my-0\\&quot;&gt; &lt;span role=\\&quot;text\\&quot; class=\\&quot;block border-t border-gray-150 pt-20 w-full\\&quot;&gt;&lt;p class=\\&quot;leading-tight text-gray-150 text-sm w-full\\&quot;&gt;&lt;span class=\\&quot;font-bold uppercase\\&quot;&gt;Colorants&lt;/span&gt; Color makes life better, enhances emotional mood, and makes our world more appealing. Color and safety go hand-in-hand. We use only safe colorants that are non-toxic and won’t accumulate in the environment. We select colors with the highest safety profiles for our home and personal care products. All are batch certified, have been thoroughly tested to be free of impurities and contaminants, and are Food, Drug &amp; Cosmetic (FD&amp;C) certified by the US Food &amp; Drug Administration (FDA).&lt;/p&gt; &lt;/span&gt;&lt;/li&gt;&lt;li class=\\&quot;list-none my-20 pt-20 lg:w-1_3 lg:my-0\\&quot;&gt; &lt;span role=\\&quot;text\\&quot; class=\\&quot;block border-t border-gray-150 pt-20 w-full\\&quot;&gt;&lt;p class=\\&quot;leading-tight text-gray-150 text-sm w-full\\&quot;&gt;&lt;span class=\\&quot;font-bold uppercase\\&quot;&gt;Preservatives&lt;/span&gt; Without proper preservatives, many natural products degrade quickly and can easily become home to mold and bacteria. The solution to keeping natural products fresh and safe is to add proven, safe, and effective preservatives. As of today, there are no effective plant-derived preservatives. If one were available, we would use it. In the meantime, we select the safest, most effective preservatives that allow us to use the tiniest amounts possible. We never use cheaper preservatives known to cause health issues such as formaldehyde or parabens.&lt;/p&gt; &lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&quot;,\n                &quot;ExpandAction&quot;: &quot;More&quot;,\n                &quot;CollapseAction&quot;: &quot;Less&quot;\n            },\n            {\n                &quot;Heading&quot;: &quot;Effective Effective Effective Effective&quot;,\n                &quot;SubHeading&quot;: &quot;We all want, expect, and need products that work as they should.&quot;,\n                &quot;Image&quot;: {\n                    &quot;Url&quot;: &quot;https://placehold.it/770x390&quot;,\n                    &quot;Alt&quot;: &quot;Image description&quot;\n                },\n                &quot;RTE&quot;: &quot;&lt;div class=\\&quot;m-rte\\&quot;&gt;&lt;div class=\\&quot;mx-auto w-full\\&quot; style=\\&quot;max-width:970px\\&quot;&gt;&lt;h3 class=\\&quot;block leading-tight text-gray-150 text-xl w-full\\&quot; style=\\&quot;max-width:570px\\&quot;&gt;Proof matters. We rigorously test our formulas to prove they work and work better than other brands. Here’s one example:&lt;/h3&gt;&lt;div class=\\&quot;mt-40 lg:flex\\&quot;&gt;&lt;div class=\\&quot;border-t border-gray-150 pt-20 md:pr-30\\&quot;&gt;&lt;p class=\\&quot;leading-tight text-gray-150 text-sm w-full\\&quot;&gt;&lt;span class=\\&quot;font-bold uppercase\\&quot;&gt;Laundry Detergent&lt;/span&gt; These fabric swatches are stained with starch-based food soils that are nearly impossible to remove. Each fabric swatch is washed one complete washing machine cycle in cold water. The results are dramatic when compared to other “green” detergents. Only MelaPower 9x® is able to remove the starch stains&lt;/p&gt;&lt;/div&gt; &lt;img src=\\&quot;//cdnsc1.melaleuca.com/na/images/product-store/melapower-stains-desktop.png\\&quot; alt=\\&quot;Melapower Stains\\&quot; class=\\&quot;hidden ml-30 md:block md:mt-20 lg:mt-0\\&quot;&gt; &lt;img src=\\&quot;//cdnsc1.melaleuca.com/na/images/product-store/melapower-stains-mobile.png\\&quot; alt=\\&quot;Melapower Stains\\&quot; class=\\&quot;mt-40 md:hidden\\&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&quot;,\n                &quot;ExpandAction&quot;: &quot;More&quot;,\n                &quot;CollapseAction&quot;: &quot;Less&quot;\n            },\n            {\n                &quot;Heading&quot;: &quot;Eco-Friendly Eco-Friendly&quot;,\n                &quot;SubHeading&quot;: &quot;Making a difference with concentrated products that reduce waste. Making a difference with concentrated products that reduce waste. Making a difference with concentrated products that reduce waste.&quot;,\n                &quot;Image&quot;: {\n                    &quot;Url&quot;: &quot;https://placehold.it/770x390&quot;,\n                    &quot;Alt&quot;: &quot;Image description&quot;\n                },\n                &quot;RTE&quot;: &quot;&lt;div class=\\&quot;m-rte\\&quot;&gt;&lt;div class=\\&quot;mx-auto w-full\\&quot; style=\\&quot;max-width:930px\\&quot;&gt;&lt;h3 class=\\&quot;block leading-tight text-gray-150 text-xl w-full\\&quot;&gt;When we say “eco-friendly” we are referring to the difference we &lt;span class=\\&quot;lg:block lg:mb-0\\&quot;&gt;make reducing waste with highly concentrated products. It’s a&lt;/span&gt;&lt;span class=\\&quot;lg:block lg:mb-0\\&quot;&gt; way we can make an impact that really matters.&lt;/span&gt;&lt;/h3&gt;&lt;div class=\\&quot;mt-40 lg:flex\\&quot;&gt;&lt;div class=\\&quot;border-t border-gray-150 pt-20 md:pr-30 lg:w-250\\&quot;&gt;&lt;p class=\\&quot;leading-tight text-gray-150 text-sm w-full\\&quot;&gt;&lt;span class=\\&quot;font-bold uppercase\\&quot;&gt;a concentrated effort&lt;/span&gt; By concentrating products, we reduce the size of everything in the supply chain. Less storage, fewer storage tanks, smaller warehouses, a smaller footprint, fewer trucks, fewer trips, less cardboard used in shipping boxes, less fuel, dramatically less greenhouse emissions, and, most of all, less virgin plastic is used in the first place.&lt;/p&gt;&lt;/div&gt;&lt;div class=\\&quot;flex flex-col items-center justify-center mt-30 w-full lg:justify-between lg:ml-50 lg:mt-0 lg:w-auto\\&quot;&gt;&lt;h3 class=\\&quot;leading-tight mb-40 text-gray-150 text-center text-xl md:mb-0\\&quot; role=\\&quot;text\\&quot;&gt;By switching to concentrated products, &lt;span class=\\&quot;font-bold uppercase md:block\\&quot;&gt;MELALEUCA CUSTOMERS HAVE SAVED&lt;/span&gt;&lt;/h3&gt;&lt;ul class=\\&quot;flex flex-col items-center w-full md:flex md:flex-row md:justify-between md:mt-15\\&quot;&gt;&lt;li class=\\&quot;flex flex-col items-center my-15 md:my-0 lg:mr-50 last:mr-0\\&quot;&gt; &lt;img src=\\&quot;//cdnsc1.melaleuca.com/na/images/product-store/eco-friendly-bottle.png\\&quot; alt=\\&quot;\\&quot;&gt;&lt;p class=\\&quot;font-medium leading-tight text-center text-gray-150 text-sm\\&quot;&gt;260 million pounds &lt;span class=\\&quot;block\\&quot;&gt;of plastic&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li class=\\&quot;flex flex-col items-center my-15 md:my-0 lg:mr-50 last:mr-0\\&quot;&gt; &lt;img src=\\&quot;//cdnsc1.melaleuca.com/na/images/product-store/eco-friendly-gas-pump.png\\&quot; alt=\\&quot;\\&quot;&gt;&lt;p class=\\&quot;font-medium leading-tight text-center text-gray-150 text-sm\\&quot;&gt;45 million gallons &lt;span class=\\&quot;block\\&quot;&gt;of fuel&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li class=\\&quot;flex flex-col items-center my-15 md:my-0 lg:mr-50 last:mr-0\\&quot;&gt; &lt;img src=\\&quot;//cdnsc1.melaleuca.com/na/images/product-store/eco-friendly-truck.png\\&quot; alt=\\&quot;\\&quot;&gt;&lt;p class=\\&quot;font-medium leading-tight text-center text-gray-150 text-sm\\&quot;&gt;1. 4 billion pounds &lt;span class=\\&quot;block\\&quot;&gt;of harmful gas emissions&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&quot;,\n                &quot;ExpandAction&quot;: &quot;More&quot;,\n                &quot;CollapseAction&quot;: &quot;Less&quot;\n            },\n            {\n                &quot;Heading&quot;: &quot;Affordable&quot;,\n                &quot;SubHeading&quot;: &quot;We not only save plastic and the environment, we save you money.&quot;,\n                &quot;Image&quot;: {\n                    &quot;Url&quot;: &quot;https://placehold.it/770x390&quot;,\n                    &quot;Alt&quot;: &quot;Image description&quot;\n                },\n                &quot;RTE&quot;: &quot;&lt;div class=\\&quot;m-rte\\&quot;&gt;&lt;div class=\\&quot;mx-auto w-full\\&quot; style=\\&quot;max-width:930px\\&quot;&gt;&lt;h3 class=\\&quot;block leading-tight text-gray-150 text-xl w-full\\&quot;&gt;Concentrated is a better value.&lt;/h3&gt;&lt;div class=\\&quot;mt-40 lg:flex\\&quot;&gt;&lt;div class=\\&quot;border-t border-gray-150 pt-20 w-full lg:max-w-260\\&quot;&gt;&lt;p class=\\&quot;leading-tight text-gray-120 text-sm w-full\\&quot;&gt;We take out unnecessary fillers (mostly water), leaving nothing that doesn’t absolutely need to be in our products. The end result? You save time, money, extra plastic, and the energy needed to ship all that water.&lt;/p&gt;&lt;/div&gt;&lt;div class=\\&quot;flex flex-col items-center justify-center mt-30 w-full md:justify-between md:ml-50 lg:mt-0\\&quot; style=\\&quot;max-width: 595px;\\&quot;&gt;&lt;table class=\\&quot;max-w-full mb-20 text-center w-full md:mx-auto md:w-auto\\&quot; aria-describedby=\\&quot;melapowerComparisonChartSummary\\&quot; cellspacing=\\&quot;0\\&quot; style=\\&quot;border-spacing: 0;border-collapse: separate;\\&quot;&gt;&lt;caption class=\\&quot;sr-only\\&quot;&gt;MelaPower Comparison Chart&lt;/caption&gt;&lt;thead&gt;&lt;tr&gt;&lt;th class=\\&quot;sr-only\\&quot;&gt;&lt;/th&gt;&lt;th class=\\&quot;font-medium pb-15 text-sm\\&quot; scope=\\&quot;col\\&quot; style=\\&quot;color:#002883;\\&quot;&gt; &lt;img class=\\&quot;mx-auto\\&quot; src=\\&quot;//cdnsc1.melaleuca.com/na/images/product-detail-pages/melapower/melapower-bottle--2x.png\\&quot; alt=\\&quot;Melapower\\&quot; /&gt; Melapower&lt;/th&gt;&lt;th class=\\&quot;font-medium pb-15 text-sm\\&quot; scope=\\&quot;col\\&quot; style=\\&quot;color:#002883;\\&quot;&gt; &lt;img class=\\&quot;mx-auto\\&quot; src=\\&quot;//cdnsc1.melaleuca.com/na/images/product-detail-pages/melapower/tide-bottle--2x.png\\&quot; alt=\\&quot;Tide&amp;reg;\\&quot; /&gt; Tide&amp;reg;&lt;/th&gt;&lt;th class=\\&quot;font-medium pb-15 text-sm\\&quot; scope=\\&quot;col\\&quot; style=\\&quot;color:#002883;\\&quot;&gt; &lt;img class=\\&quot;mx-auto\\&quot; src=\\&quot;//cdnsc1.melaleuca.com/na/images/product-detail-pages/melapower/method-bottle--2x.png\\&quot; alt=\\&quot;Method&amp;reg;\\&quot; /&gt; Method&amp;reg;&lt;/th&gt;&lt;th class=\\&quot;font-medium pb-15 text-sm\\&quot; scope=\\&quot;col\\&quot; style=\\&quot;color:#002883;\\&quot;&gt; &lt;img class=\\&quot;mx-auto\\&quot; src=\\&quot;//cdnsc1.melaleuca.com/na/images/product-detail-pages/melapower/grove-bottle--2x.png\\&quot; alt=\\&quot;Grove&amp;reg;\\&quot; /&gt; Grove&amp;reg;&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr class=\\&quot;mb-0\\&quot;&gt;&lt;th class=\\&quot;sr-only\\&quot; scope=\\&quot;row\\&quot;&gt;Price Per Load&lt;/th&gt;&lt;td class=\\&quot;italic leading-base mb-0 p-0 relative text-sm\\&quot; style=\\&quot;color:#777777;\\&quot;&gt;&lt;div class=\\&quot;border border-b-0 mb-0 mx-5 px-10 py-15 sm:mx-15\\&quot; style=\\&quot;border-color:#707070;\\&quot;&gt; &lt;span class=\\&quot;font-bold italic text-2xl\\&quot; style=\\&quot;color:#0DBBF0;\\&quot;&gt;18&amp;cent;&lt;/span&gt;&lt;br /&gt;per load&lt;/div&gt;&lt;/td&gt;&lt;td class=\\&quot;italic leading-base mb-0 p-0 relative text-sm\\&quot; style=\\&quot;color:#777777;\\&quot;&gt;&lt;div class=\\&quot;border border-b-0 mb-
