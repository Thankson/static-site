      "patternDesc": "<h2>Markup Guidelines</h2>\n<h3>Blocks</h3>\n<p>Each <code>__link</code> element and its children constitute one &quot;block&quot;.</p>\n<p>There can be a maximum of two blocks.</p>\n<p>If there is only 1 block, it will automatically fill the space.</p>\n<p>If there are 2 blocks, it will automatically split into two columns.</p>\n<h3>ADA</h3>\n<p>The <code>__link</code> element also requires an <code>aria-label</code> with a content authored description.</p>\n<h3>Images</h3>\n<p>There are two image types: background and overlay.</p>\n<p>Each image type has two options: <code>-desktop</code> and <code>-mobile</code>.</p>\n<p>The background images, both desktop and mobile, must come before the overlay images.</p>\n<p>The mobile overlay is optional.</p>\n<h3>Modifiers</h3>\n<p>There are 3 types of alignments: Vertical, Horizontal, and Text.</p>\n<ol>\n<li>Vertical classes: <code>-top</code>, <code>-middle</code>, <code>-bottom</code></li>\n<li>Horizontal classes: <code>-left</code>, <code>-center</code>, <code>-right</code></li>\n<li>Text Classes: <code>text-left</code>, <code>text-center</code>, <code>text-right</code></li>\n</ol>\n<p>All vertical and horizontal alignment classes will reside on the <code>__link</code> element as denoted in the mustache by <code>{{Mods.ContentAlign}}</code></p>\n<p>Text alignment can live on two elements:</p>\n<ol>\n<li><code>__header</code> as denoted by <code>{{Mods.TitleAlign}}</code></li>\n<li><code>__cta</code> as denoted by <code>{{Mods.CtaAlign}}</code></li>\n</ol>\n<h2>Image Guidelines</h2>\n<p>All image sizes are required to be, at minimum, the size of the block.</p>\n<ol>\n<li>Example 1: if using two blocks then the minimum image size would be <code>590px x 411px</code>.</li>\n<li>Example 2: if using a full width block, the image size would need to be <code>1170px x 411px</code></li>\n</ol>\n<p>This applies to overlay imagery, including all the transparent space within it.\nFE does not handle the location of overlay imagery.\nMeaning, if design requires a logo to be on the right, then the author will need to provide an image with a logo on the right. This gives greater flexibility to the design and authoring team.</p>\n",
