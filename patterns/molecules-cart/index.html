			{"cssEnabled":false,"patternLineageExists":false,"patternLineages":[],"lineage":[],"patternLineageRExists":false,"patternLineagesR":[],"lineageR":[],"patternLineageEExists":false,"patternDesc":"<h2>Overview</h2>\n<p>The Cart Component Summary is a Vue component abstracting cart summary markup while also providing a few toggles to hide/show some of that markup.</p>\n<h3>Notes</h3>\n<ul>\n<li>Related to:\n<ul>\n<li><a href=\"/?p=atoms-button-vue-cart-checkout\">Button Vue Cart Checkout</a>\n<ul>\n<li>Child</li>\n</ul>\n</li>\n<li><a href=\"/?p=pages-cart\">Cart</a>\n<ul>\n<li>Parent</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n<h3>VueJs:</h3>\n<h4>Implementation</h4>\n<p>All text to be localized or translated in this component is passed by named slots: <a href=\"https://vuejs.org/v2/guide/components-slots.html#Named-Slots\">Vue Documentation - Named Slots</a></p>\n<ul>\n<li>Passing this data via named slots passed the responsibility of localization to the parent component so that this component doesn't need to know anything about the API data or how it's formatted. This allows us to reuse this component if that data is outputted differently.</li>\n</ul>\n<h4>Named Slots</h4>\n<ul>\n<li><strong>heading</strong>\n<ul>\n<li>Hidden if unused</li>\n</ul>\n</li>\n<li><strong>item-total</strong>\n<ul>\n<li>Default: <code>Item Total</code></li>\n</ul>\n</li>\n<li><strong>lsd-total</strong>\n<ul>\n<li>Toggled via &quot;show-lsd-total&quot; prop</li>\n<li>Default: <code>&lt;u&gt;Loyalty Shopping Dollars&lt;/u&gt;&lt;br /&gt;used this order</code></li>\n</ul>\n</li>\n<li><strong>cc-total</strong>\n<ul>\n<li>Toggled via &quot;show-cc-total&quot; prop</li>\n<li>Default: <code>&lt;u&gt;Convenience Certificates&lt;/u&gt;&lt;br /&gt;used this order</code></li>\n</ul>\n</li>\n<li><strong>subtotal</strong>\n<ul>\n<li>Default: <code>Subtotal</code></li>\n</ul>\n</li>\n<li><strong>points</strong>\n<ul>\n<li>Default: <code>Points</code></li>\n</ul>\n</li>\n<li><strong>shipping-taxes</strong>\n<ul>\n<li>Default: <code>Shipping and taxes&lt;br /&gt;(calculated in checkout)</code></li>\n</ul>\n</li>\n<li><strong>checkout-label</strong>\n<ul>\n<li>Toggled via &quot;show-checkout&quot; prop</li>\n<li>Default: <code>PROCEED TO CHECKOUT</code></li>\n</ul>\n</li>\n<li><strong>error</strong>\n<ul>\n<li>Hidden if unused</li>\n</ul>\n</li>\n<li><strong>savings</strong>\n<ul>\n<li>Toggled via &quot;show-savings&quot; prop</li>\n</ul>\n</li>\n<li><strong>savings-heading</strong>\n<ul>\n<li>Toggled via &quot;show-savings&quot; prop</li>\n<li>Default: <code>As a Preferred Member,</code></li>\n</ul>\n</li>\n</ul>\n<h4>Props</h4>\n<ul>\n<li><strong>item-total</strong>\n<ul>\n<li>Type: String</li>\n<li>Required</li>\n<li>Item total before lsd and cc payment subtractions</li>\n</ul>\n</li>\n<li><strong>lsd-total</strong>\n<ul>\n<li>Type: String</li>\n<li>Default: ''</li>\n<li>Total Loyalty Savings Dollars (lsd) being used for cart payment</li>\n</ul>\n</li>\n<li><strong>show-lsd-total</strong>\n<ul>\n<li>Type: Boolean</li>\n<li>Default: false</li>\n<li>Hide/Show Lsd Total item</li>\n</ul>\n</li>\n<li><strong>cc-total</strong>\n<ul>\n<li>Type: String</li>\n<li>Default: ''</li>\n<li>Total Convenience Certificate (cc) being used for cart payment</li>\n</ul>\n</li>\n<li><strong>show-cc-total</strong>\n<ul>\n<li>Type: Boolean</li>\n<li>Default: false</li>\n<li>Hide/Show Cc Total item</li>\n</ul>\n</li>\n<li><strong>subtotal</strong>\n<ul>\n<li>Type: String,</li>\n<li>Required</li>\n<li>Subtotal of cart after lsd and cc payment subtractions</li>\n</ul>\n</li>\n<li><strong>points</strong>\n<ul>\n<li>Type: String|Number</li>\n<li>Required</li>\n<li>Total Points in current cart</li>\n</ul>\n</li>\n<li><strong>shipping</strong>\n<ul>\n<li>Type: String,</li>\n<li>Default: ''</li>\n<li>Total Shipping &amp; Taxes fees</li>\n</ul>\n</li>\n<li><strong>show-checkout</strong>\n<ul>\n<li>Type: Boolean</li>\n<li>Default: true</li>\n<li>Hide/Show the checkout button/link</li>\n</ul>\n</li>\n<li><strong>checkout-url</strong>\n<ul>\n<li>Type: String</li>\n<li>Default: null</li>\n<li>If the checkout cta is a link, render it has a link with this url</li>\n</ul>\n</li>\n<li><strong>show-savings</strong>\n<ul>\n<li>Type: Boolean</li>\n<li>Default: false,</li>\n<li>Show preferred member savings</li>\n</ul>\n</li>\n</ul>\n","patternBreadcrumb":{"patternGroup":"molecules","patternSubgroup":"cart"},"patternExtension":"hbs","patternName":"Cart Summary","patternPartial":"molecules-cart-summary","patternState":"","patternEngineName":"handlebars","extraOutput":{}}
