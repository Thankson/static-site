<m-access-identify :handler="() => true" country="ca">
  <template v-slot:heading>
    Having Trouble Accessing Your Account?
  </template>

  <template v-slot:description>
    <p><strong>Enter your email address or mobile number on file</strong> with Melaleuca and we will send you instructions on how to access your account by either Email or text. If you do not receive a code, make sure you typed in your email or mobile number correctly, or call <a href="tel:1-800-742-2444">Customer Support</a> at 1-800-742-2444.</p>
  </template>

  <template v-slot:email-phone-label>
    ENTER EMAIL ADDRESS OR MOBILE NUMBER
  </template>

  <template v-slot:email-phone-error>
    Please enter your email or phone number
  </template>

  <template v-slot:customer-id-description>
    <p>This phone number is associated with another account. Please enter your Customer ID number or try entering it again</p>
  </template>

  <template v-slot:customer-id-label>
    CUSTOMER ID NUMBER
  </template>

  <template v-slot:customer-id-error>
    Please enter your email or phone number
  </template>

  <template v-slot:api-error>
    Invalid Format. Please try again.
  </template>
  <template v-slot:customer-id-error>
    Invalid Customer ID. Please try again. If you believe you entered your Customer ID Number correctly, and cannot proceed, please call Customer Suppoer at 1-800-742-2444.
  </template>

  <template v-slot:button-label>
    Continue
  </template>


</m-access-identify>
