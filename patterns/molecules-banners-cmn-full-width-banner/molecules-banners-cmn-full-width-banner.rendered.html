      "patternLineageEExists": true,
      "patternDesc": "<h2>For full view of JSON options go to the <em>_data</em> folder's <code>fwBanner.json</code> file.</h2>\n<h2>ATTENTION - Videos</h2>\n<ol>\n<li>Do not use the video version. Instead, use the VUE-video version localized in the product store env (molecules-full-width-banner-vue-video).</li>\n</ol>\n<h2>Main Block Level Modifiers (<code>m-fwBanner</code>)</h2>\n<h3>The main block  has up to 3 modifiers:</h3>\n<ol>\n<li>Block Height</li>\n</ol>\n<blockquote>\n<ul>\n<li>Height classes</li>\n<li><code>-h-sm</code> = min-height of 192px</li>\n<li><code>-h-sm-md</code> = min-height of 220px</li>\n<li><code>-h-md</code> = min-height of 272px</li>\n<li><code>-h-lg</code> = min-height of 380px</li>\n</ul>\n</blockquote>\n<ol>\n<li><code>-videoToggle</code></li>\n</ol>\n<blockquote>\n<ul>\n<li>Note | For video modal toggle button</li>\n<li><strong>[variant]</strong></li>\n</ul>\n</blockquote>\n<ol>\n<li><code>-stackMobile</code></li>\n</ol>\n<blockquote>\n<ul>\n<li>Note | Stack media above content at mobile</li>\n</ul>\n</blockquote>\n<ol>\n<li><code>-slide</code></li>\n</ol>\n<blockquote>\n<ul>\n<li>Note | when teaser is used as a slide in a carousel</li>\n<li><strong>[variant]</strong></li>\n</ul>\n</blockquote>\n<ol>\n<li><code>-imageGrid</code></li>\n</ol>\n<blockquote>\n<ul>\n<li>Note | No stack at mobile</li>\n<li>For an grid block of 4 images/links</li>\n<li><strong>[variant]</strong></li>\n</ul>\n</blockquote>\n<ol>\n<li><code>-category</code></li>\n</ol>\n<blockquote>\n<ul>\n<li>Note | To add padding on the side to match the category page layout</li>\n<li>For the top banner on the category page</li>\n</ul>\n</blockquote>\n<h3>Additional notes about the modifiers:</h3>\n<p><strong>HEIGHT</strong> :</p>\n<p>There can only be 1 height modifier at any given time, they <strong>cannot</strong> be combined together.</p>\n<p><strong>SLIDE</strong> :</p>\n<p><code>-slide</code> can be used in conjunction with any of the modifiers.</p>\n<p><strong>VIDEO TOGGLE</strong> :</p>\n<p>if the <code>-videoToggle</code> modifier is used, <code>-stackMobile</code> is <strong>required</strong>.</p>\n<p><strong>IMAGE GRID</strong> :</p>\n<p>if the <code>-imageGrid</code> modifier is used, <code>-stackMobile</code> <strong>CANNOT</strong> be used.</p>\n<p><strong>STACK AT MOBILE</strong>:</p>\n<p>Can be used at any time with the exception of the presence of the image grid modifier.</p>\n<h2>Variants continued</h2>\n<p>As mentioned at the beginning, there are multiple variants for the teaser.\nVariants are visually unique versions of the component that <strong>CANNOT</strong> be combined with the Content Sizing nor Content Alignment features without adverse side effects. Only the <code>-slide</code> variant can be combined with any other variant. (<em>More on content alignment/sizing options in the next section.</em>)</p>\n<ol>\n<li><code>-slide</code> when used as a slide within a carousel</li>\n<li><code>-videoToggle</code> to include the mela/jwplayer modal toggle button feature in the right column</li>\n<li><code>-imageGrid</code> to include a grid of 4 images in the right column.</li>\n</ol>\n<h2>Content Modifiers</h2>\n<p>The element with the classes <code>m-fwBanner__row -columns</code> has 5 available modifiers:</p>\n<ol>\n<li>Content size</li>\n</ol>\n<blockquote>\n<ul>\n<li><code>-w-xl</code></li>\n<li><code>-w-lg</code></li>\n<li><code>-w-md</code></li>\n<li><code>-w-sm</code></li>\n<li><code>-w-xs</code></li>\n</ul>\n</blockquote>\n<ol>\n<li>Content X Align</li>\n</ol>\n<blockquote>\n<ul>\n<li><code>-left</code></li>\n<li><code>-center</code></li>\n<li><code>-right</code></li>\n</ul>\n</blockquote>\n<ol>\n<li>Content Y Align</li>\n</ol>\n<blockquote>\n<ul>\n<li><code>-top</code></li>\n<li><code>-middle</code></li>\n<li><code>-bottom</code></li>\n</ul>\n</blockquote>\n<ol>\n<li>Content Text Align</li>\n</ol>\n<blockquote>\n<ul>\n<li><code>-text-center</code></li>\n</ul>\n</blockquote>\n<h2>Backgrounds</h2>\n<p>Backgrounds live in the <code>m-fwBanner__row -media</code> element as two types:</p>\n<ol>\n<li>Image Background</li>\n<li>Color Background</li>\n<li>Video Background</li>\n</ol>\n<h3>Image Backgrounds</h3>\n<p>Content authors are allowed to add whatever classes they find necessary to get the images to look right.</p>\n<h3>Color Backgrounds</h3>\n<p>A colored background is a possible option allowing a content author to define a single line text value of:</p>\n<ol>\n<li>hex , ex. <code>#30862D</code></li>\n<li>rgba , ex. <code>rgba(48, 134, 45, 1)</code></li>\n<li>gradient, ex. <code>linear-gradient(90deg, #e3ffe7 0%, #d9e7ff 100%)</code></li>\n</ol>\n<p><strong>Note:</strong> This value gets placed as a style attribute css property.</p>\n<h2>CTA Button</h2>\n<p>The CTA button is an optional element. When present the user has the ability to choose the alignment of the CTA button.</p>\n<p>CTA alignment options (<code>ButtonXAlign</code>):</p>\n<ol>\n<li><code>-left</code></li>\n<li><code>-center</code></li>\n<li><code>-right</code></li>\n</ol>\n<p>The button itself is also customizable see <code>atoms-author-btn</code> for more information.</p>\n",

      "patternLineageEExists": true,
      "patternDesc": "<h2>For full view of JSON options go to the <em>_data</em> folder's <code>fwBanner.json</code> file.</h2>\n<h2>ATTENTION - Videos</h2>\n<ol>\n<li>Do not use the video version. Instead, use the VUE-video version localized in the product store env (molecules-full-width-banner-vue-video).</li>\n</ol>\n<h2>Main Block Level Modifiers (<code>m-fwBanner</code>)</h2>\n<h3>The main block  has up to 3 modifiers:</h3>\n<ol>\n<li>Block Height</li>\n</ol>\n<blockquote>\n<ul>\n<li>Height classes</li>\n<li><code>-h-sm</code> = min-height of 192px</li>\n<li><code>-h-sm-md</code> = min-height of 220px</li>\n<li><code>-h-md</code> = min-height of 272px</li>\n<li><code>-h-lg</code> = min-height of 380px</li>\n</ul>\n</blockquote>\n<ol>\n<li><code>-videoToggle</code></li>\n</ol>\n<blockquote>\n<ul>\n<li>Note | For video modal toggle button</li>\n<li><strong>[variant]</strong></li>\n</ul>\n</blockquote>\n<ol>\n<li><code>-stackMobile</code></li>\n</ol>\n<blockquote>\n<ul>\n<li>Note | Stack media above content at mobile</li>\n</ul>\n</blockquote>\n<ol>\n<li><code>-slide</code></li>\n</ol>\n<blockquote>\n<ul>\n<li>Note | when teaser is used as a slide in a carousel</li>\n<li><strong>[variant]</strong></li>\n</ul>\n</blockquote>\n<ol>\n<li><code>-imageGrid</code></li>\n</ol>\n<blockquote>\n<ul>\n<li>Note | No stack at mobile</li>\n<li>For an grid block of 4 images/links</li>\n<li><strong>[variant]</strong></li>\n</ul>\n</blockquote>\n<ol>\n<li><code>-category</code></li>\n</ol>\n<blockquote>\n<ul>\n<li>Note | To add padding on the side to match the category page layout</li>\n<li>For the top banner on the category page</li>\n</ul>\n</blockquote>\n<h3>Additional notes about the modifiers:</h3>\n<p><strong>HEIGHT</strong> :</p>\n<p>There can only be 1 height modifier at any given time, they <strong>cannot</strong> be combined together.</p>\n<p><strong>SLIDE</strong> :</p>\n<p><code>-slide</code> can be used in conjunction with any of the modifiers.</p>\n<p><strong>VIDEO TOGGLE</strong> :</p>\n<p>if the <code>-videoToggle</code> modifier is used, <code>-stackMobile</code> is <strong>required</strong>.</p>\n<p><strong>IMAGE GRID</strong> :</p>\n<p>if the <code>-imageGrid</code> modifier is used, <code>-stackMobile</code> <strong>CANNOT</strong> be used.</p>\n<p><strong>STACK AT MOBILE</strong>:</p>\n<p>Can be used at any time with the exception of the presence of the image grid modifier.</p>\n<h2>Variants continued</h2>\n<p>As mentioned at the beginning, there are multiple variants for the teaser.\nVariants are visually unique versions of the component that <strong>CANNOT</strong> be combined with the Content Sizing nor Content Alignment features without adverse side effects. Only the <code>-slide</code> variant can be combined with any other variant. (<em>More on content alignment/sizing options in the next section.</em>)</p>\n<ol>\n<li><code>-slide</code> when used as a slide within a carousel</li>\n<li><code>-videoToggle</code> to include the mela/jwplayer modal toggle button feature in the right column</li>\n<li><code>-imageGrid</code> to include a grid of 4 images in the right column.</li>\n</ol>\n<h2>Content Modifiers</h2>\n<p>The element with the classes <code>m-fwBanner__row -columns</code> has 5 available modifiers:</p>\n<ol>\n<li>Content size</li>\n</ol>\n<blockquote>\n<ul>\n<li><code>-w-xl</code></li>\n<li><code>-w-lg</code></li>\n<li><code>-w-md</code></li>\n<li><code>-w-sm</code></li>\n<li><code>-w-xs</code></li>\n</ul>\n</blockquote>\n<ol>\n<li>Content X Align</li>\n</ol>\n<blockquote>\n<ul>\n<li><code>-left</code></li>\n<li><code>-center</code></li>\n<li><code>-right</code></li>\n</ul>\n</blockquote>\n<ol>\n<li>Content Y Align</li>\n</ol>\n<blockquote>\n<ul>\n<li><code>-top</code></li>\n<li><code>-middle</code></li>\n<li><code>-bottom</code></li>\n</ul>\n</blockquote>\n<ol>\n<li>Content Text Align</li>\n</ol>\n<blockquote>\n<ul>\n<li><code>-text-center</code></li>\n</ul>\n</blockquote>\n<h2>Backgrounds</h2>\n<p>Backgrounds live in the <code>m-fwBanner__row -media</code> element as two types:</p>\n<ol>\n<li>Image Background</li>\n<li>Color Background</li>\n<li>Video Background</li>\n</ol>\n<h3>Image Backgrounds</h3>\n<p>Content authors are allowed to add whatever classes they find necessary to get the images to look right.</p>\n<h3>Color Backgrounds</h3>\n<p>A colored background is a possible option allowing a content author to define a single line text value of:</p>\n<ol>\n<li>hex , ex. <code>#30862D</code></li>\n<li>rgba , ex. <code>rgba(48, 134, 45, 1)</code></li>\n<li>gradient, ex. <code>linear-gradient(90deg, #e3ffe7 0%, #d9e7ff 100%)</code></li>\n</ol>\n<p><strong>Note:</strong> This value gets placed as a style attribute css property.</p>\n<h2>CTA Button</h2>\n<p>The CTA button is an optional element. When present the user has the ability to choose the alignment of the CTA button.</p>\n<p>CTA alignment options (<code>ButtonXAlign</code>):</p>\n<ol>\n<li><code>-left</code></li>\n<li><code>-center</code></li>\n<li><code>-right</code></li>\n</ol>\n<p>The button itself is also customizable see <code>atoms-author-btn</code> for more information.</p>\n",
