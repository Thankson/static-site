<div class="w-full lg:w-1_2 sm:pr-20 pb-20">
  <div>
    <div class="m-formField -text">
      <label class="m-formField__label" for="fpassword">NEW PASSWORD <i class="text-sm font-medium">(8 or more characters, including 1 UPPERCASE and 1 number)</i></label>
      <a-input-glimpse :attributes="{
                            'Id': 'fpassword',
                            'Name': 'fpassword',
                            'MinLength': '1',
                            'MaxLength': '100',
                            'Required': 'true',
                            'Placeholder': 'Enter New Password',
                    }" :init-hidden="true" show-label="Show Password" hide-label="Hide Password" autocomplete="off" input-classname="a-input -text text-sm">
      </a-input-glimpse>
    </div>
  </div>
  <div>
    <div class="m-formField -text">
      <label class="m-formField__label" for="fpassword-confirm">CONFIRM PASSWORD</label>
      <a-input-glimpse :attributes="{
                            'Id': 'fpassword-confirm',
                            'Name': 'fpassword-confirm',
                            'MinLength': '1',
                            'MaxLength': '100',
                            'Required': 'true',
                            'Placeholder': 'Re-enter New Password',
                    }" :init-hidden="true" show-label="Show Password" hide-label="Hide Password" autocomplete="off" input-classname="a-input -text text-sm">
      </a-input-glimpse>
    </div>
  </div>
  <div class="pt-10 min-w-270 md:w-1_2 font-normal">
    <button class="a-button -save sm:min-w-full to-sm:min-w-full md:text-md" type="submit" aria-label="Submit Form" style="">
      UPDATE PASSWORD
    </button>
  </div>
</div>
