<form class="max-w-contain mx-10 xl:mx-auto my-15">
  <div class="">
    <div>
      <div class="m-formField -text">
        <label class="m-formField__label" for="fssn">SSN</label>
        <a-input-glimpse :attributes="{
                                'Id': 'fssn',
                                'Name': 'fssn',
                                'MinLength': '1',
                                'MaxLength': '100',
                                'Required': 'true',
                                'Placeholder': 'Social Security Number',
                                'pattern': '[0-9]*',
                                'Inputmode': 'numeric',
                        }" :init-hidden="false" show-label="Show SSN" hide-label="Hide SSN" autocomplete="on" input-classname="a-input -text">
        </a-input-glimpse>
      </div>
    </div>
    <div>
      <div class="m-formField -text">
        <label class="m-formField__label" for="fpassword">Password</label>
        <a-input-glimpse :attributes="{
                                'Id': 'fpassword',
                                'Name': 'fpassword',
                                'MinLength': '1',
                                'MaxLength': '100',
                                'Required': 'true',
                                'Placeholder': '8+ characters (must include 1 capital and 1 number)',
                        }" :init-hidden="true" show-label="Show Password" hide-label="Hide Password" autocomplete="off" input-classname="a-input -text">
        </a-input-glimpse>
      </div>
    </div>
  </div>
</form>
